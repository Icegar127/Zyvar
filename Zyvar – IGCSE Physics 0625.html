const U=[
{n:"Motion, forces and energy",d:"Measurement, motion, forces, momentum, energy and power",k:["Use rulers, cylinders and timers, and tell scalars from vectors","Read distance–time and speed–time graphs","Use F = ma, weight, moments and momentum","Work out density and pressure","Calculate kinetic energy, work, power and efficiency","Compare energy resources"],f:"v = s ÷ t, a = Δv ÷ Δt, W = mg, F = ma, p = mv, ρ = m ÷ V, p = F ÷ A, Ek = ½mv², ΔEp = mgΔh, W = Fd, P = W ÷ t, efficiency",l:[
 {t:"Measurement and vectors",i:[
  ["Use a ruler for length and a measuring cylinder for liquid volume. To time a pendulum, time 20 swings and divide by 20.","You time 20 swings of a pendulum and get 32 s. What is the period?",["0.63 s","1.6 s","640 s","12 s"],1],
  ["A scalar has size only (distance, speed, mass, energy). A vector has size and direction (force, velocity, weight, momentum).","Which of these is a vector?",["Mass","Speed","Temperature","Force"],3],
  ["Two forces at right angles combine with Pythagoras: R = √(A² + B²).","Forces of 3 N and 4 N act at right angles. What is the resultant?",["7 N","1 N","5 N","12 N"],2,1]]},
 {t:"Speed, velocity and graphs",i:[
  ["As a falling ball speeds up, air resistance grows, so the resultant force falls and the acceleration falls. At terminal velocity both are zero.","A ball falls but has not reached terminal velocity. What happens as it speeds up?",["Resultant force and acceleration both decrease","Resultant force increases","Acceleration increases","Weight decreases"],0,1],
  ["Speed is distance per unit time: v = s ÷ t. Velocity is speed in a given direction.","A car travels 150 m in 10 s. What is its speed?",["1500 m/s","15 m/s","0.07 m/s","160 m/s"],1],
  ["On a distance–time graph the gradient is the speed. A horizontal line means the object is at rest.","What does a horizontal line on a distance–time graph show?",["Constant speed","Acceleration","The object is at rest","Deceleration"],2],
  ["Acceleration is change in velocity per unit time: a = Δv ÷ Δt. A deceleration is a negative acceleration.","A car speeds up from 0 to 20 m/s in 5 s. What is its acceleration?",["4 m/s²","100 m/s²","0.25 m/s²","15 m/s²"],0,1],
  ["The area under a speed–time graph is the distance travelled.","A car moves at a constant 10 m/s for 6 s. What distance is the area under its speed–time graph?",["1.7 m","16 m","60 m","600 m"],2],
  ["At terminal velocity air resistance equals weight, so the resultant force is zero and speed stays constant.","What is true at terminal velocity?",["Weight is bigger than drag","Drag equals weight","The object accelerates","Drag is zero"],1,1]]},
 {t:"Weight, forces and momentum",i:[
  ["A resultant force at right angles to the motion changes direction but not speed. On a bend it points towards the centre of the curve.","A car goes round a bend at constant speed. Where does the resultant force point?",["Forwards","Backwards","Towards the inside of the bend","Towards the outside of the bend"],2,1],
  ["Resultant force = mass × acceleration (F = ma). Force and acceleration point the same way.","A resultant force of 12 N acts on a 3 kg trolley. What is its acceleration?",["36 m/s²","0.25 m/s²","15 m/s²","4 m/s²"],3,1],
  ["Momentum is mass × velocity: p = mv. It is a vector and is measured in kg m/s.","What is the momentum of a 2 kg trolley moving at 5 m/s?",["10 kg m/s","7 kg m/s","2.5 kg m/s","0.4 kg m/s"],0,1],
  ["Weight is a gravitational force: W = mg, with g ≈ 9.8 N/kg on Earth.","What is the weight of a 5 kg mass? (g = 10 N/kg)",["0.5 N","5 N","15 N","50 N"],3]]},
 {t:"Moments and stability",i:[
  ["Moment = force × perpendicular distance from the pivot. A balanced beam has equal clockwise and anticlockwise moments.","A 20 N force acts 0.5 m from a pivot. What is its moment?",["40 N m","10 N m","20.5 N m","0.025 N m"],1],
  ["An object is stable if it has a low centre of gravity and a wide base. It topples if the line of its weight falls outside the base.","What makes a bus more stable?",["A high centre of gravity","A narrow base","A low centre of gravity","Luggage on the roof"],2]]},
 {t:"Density and pressure",i:[
  ["Density ρ = m ÷ V. An object floats if its density is less than the liquid’s.","A block has mass 300 g and volume 100 cm³. What is its density?",["3 g/cm³","0.33 g/cm³","30 000 g/cm³","200 g/cm³"],0],
  ["Pressure p = F ÷ A. The same force on a smaller area gives a larger pressure.","A 100 N force acts on an area of 0.5 m². What is the pressure?",["50 Pa","200 Pa","100.5 Pa","0.005 Pa"],1]]},
 {t:"Energy, work and power",i:[
  ["Kinetic energy: Ek = ½mv². Work done W = Fd equals the energy transferred.","What is the kinetic energy of a 2 kg object moving at 3 m/s?",["18 J","9 J","6 J","3 J"],1,1],
  ["Efficiency = useful output ÷ total input × 100%. It can never exceed 100%.","A machine takes in 200 J and gives 40 J of useful energy. What is its efficiency?",["20%","5%","40%","80%"],0,1],
  ["Power is energy transferred per unit time: P = E ÷ t.","A motor transfers 600 J in 20 s. What is its power?",["12 000 W","30 W","580 W","0.03 W"],1],
  ["Gravitational potential energy change: ΔEp = mgΔh.","How much GPE does a 3 kg mass gain when lifted 2 m? (g = 10 N/kg)",["6 J","15 J","600 J","60 J"],3,1],
  ["Work done = force × distance moved in the direction of the force.","A 40 N force moves a box 5 m. How much work is done?",["8 J","45 J","200 J","0.125 J"],2],
  ["Energy is never destroyed, only transferred between stores. Wasted energy spreads to the surroundings.","A lamp gives 20 J of light from 100 J of electrical energy. What happens to the other 80 J?",["It is destroyed","It is dissipated, mostly as heat","It becomes light later","It is stored in the lamp"],1]]},
 {t:"Energy resources",i:[
  ["Renewable resources (solar, wind, hydroelectric, tidal, geothermal, biofuel) are replenished. Fossil fuels and nuclear fuel are finite.","Which energy resource is non-renewable?",["Wind","Natural gas","Tidal","Solar"],1],
  ["A power station boils water to make steam, which turns a turbine connected to a generator.","In a fossil-fuel power station, what turns the generator?",["A turbine driven by steam","A solar cell","A transformer","A battery"],0]]}]},
{n:"Thermal physics",d:"Particle model, thermal properties and energy transfer",k:["Describe solids, liquids and gases with the particle model","Explain gas pressure and convert between °C and K","Compare conduction, convection and radiation","Explain evaporation, boiling and melting","Use specific heat capacity"],f:"T = θ + 273, pV = constant, c = ΔE ÷ (mΔθ)",l:[
 {t:"Particle model and gases",i:[
  ["Gas pressure is caused by particles colliding with the walls of their container.","A gas is heated at constant volume. Why does its pressure rise?",["Particles get larger","There are more particles","Particles collide harder and more often","Particles stop moving"],2],
  ["Convert with T (K) = θ (°C) + 273. Absolute zero is −273 °C.","What is 27 °C in kelvin?",["246 K","300 K","27 K","273 K"],1],
  ["In a solid, particles vibrate in fixed positions. In a liquid they slide past each other. In a gas they move freely, far apart.","Which state has particles close together but able to move past each other?",["Solid","Gas","None of them","Liquid"],3],
  ["For a fixed mass of gas at constant temperature, pV = constant. Squashing the gas raises its pressure.","A gas at 100 kPa and 6 m³ is compressed to 2 m³ at constant temperature. What is the new pressure?",["33 kPa","300 kPa","200 kPa","600 kPa"],1,1],
  ["Specific heat capacity c = ΔE ÷ (mΔθ).","2 kg of water gains 168 000 J and warms by 20 °C. What is c?",["8400 J/(kg °C)","16 800 J/(kg °C)","4200 J/(kg °C)","840 J/(kg °C)"],2,1]]},
 {t:"Thermal expansion and heat capacity",i:[
  ["Solids, liquids and gases expand when heated. Gases expand most and solids least, because particles in solids are held tightly together.","Which expands the most for the same temperature rise?",["Solid","Liquid","Gas","They all expand equally"],2],
  ["Gaps are left in railway tracks and bridges to allow for expansion on hot days.","Why are small gaps left between sections of railway track?",["To allow for expansion","To save metal","To reduce friction","To let trains turn"],0]]},
 {t:"Heat transfer",i:[
  ["Convection happens in fluids. Warmed fluid expands, becomes less dense and rises.","Why does hot air rise?",["It is less dense","It is heavier","It is lighter in mass only","It is pulled by magnets"],0],
  ["Dull black surfaces are the best absorbers and emitters of infrared radiation. Shiny white surfaces are the worst.","Which surface cools fastest by radiation?",["Shiny white","Shiny silver","Dull black","Dull white"],2],
  ["Conduction passes energy through solids. In metals, free electrons carry energy quickly.","Why are metals good thermal conductors?",["They are shiny","They contain free electrons","They have large particles","They are dense only"],1]]},
 {t:"Evaporation and boiling",i:[

{n:"Waves",d:"Wave properties, light, the EM spectrum and sound",k:["Use v = fλ and tell transverse from longitudinal waves","Describe reflection, refraction, diffraction and total internal reflection","Order the EM spectrum and give its uses and dangers","Describe sound, echoes, pitch and loudness","Describe how lenses form images"],f:"v = fλ, i = r, n = sin i ÷ sin r, n = 1 ÷ sin c, d = vt ÷ 2",l:[
 {t:"Wave properties",i:[
  ["The crest is the highest point of a wave and the trough the lowest. Wavelength is crest to crest. Amplitude is measured from the rest line to a crest.","A wave has a crest-to-trough height of 8 cm. What is its amplitude?",["8 cm","16 cm","4 cm","2 cm"],2],
  ["Frequency f = 1 ÷ T, where T is the period in seconds.","A wave has a period of 0.02 s. What is its frequency?",["0.02 Hz","2 Hz","50 Hz","200 Hz"],2,1],
  ["Wave speed: v = fλ. In a longitudinal wave the vibration is parallel to the direction of travel.","A wave has f = 50 Hz and λ = 2 m. What is its speed?",["25 m/s","52 m/s","100 m/s","0.04 m/s"],2],
  ["Sound waves and seismic P-waves are longitudinal. Light, water waves and S-waves are transverse.","Which of these is a longitudinal wave?",["Light","Sound","Water waves","Radio waves"],1],
  ["Frequency is waves per second (Hz). Wavelength is the distance between identical points on adjacent waves.","Radio waves travel at 3.0 × 10⁸ m/s with a wavelength of 3 m. What is the frequency?",["9.0 × 10⁸ Hz","1 Hz","1.0 × 10⁸ Hz","10 Hz"],2,1],
  ["Diffraction is the spreading of waves at a gap or edge. It is greatest when the gap is about the same size as the wavelength.","When is diffraction through a gap most noticeable?",["Gap much wider than the wavelength","Gap about the same size as the wavelength","Gap much narrower than the wavelength","It does not depend on the gap"],1]]},
 {t:"Diffraction and ripple tanks",i:[
  ["In a ripple tank, waves slow down in shallow water. Their wavelength gets shorter and they refract.","What happens to a water wave moving from deep to shallow water?",["Speed and wavelength both decrease","Frequency decreases","Speed increases","Wavelength increases"],0],
  ["The frequency of a wave does not change when it refracts. Only the speed and wavelength change.","A wave refracts. Which quantity stays the same?",["Speed","Wavelength","Frequency","Direction"],2],
  ["Diffraction is greatest when the gap is about one wavelength wide. A longer wavelength diffracts more.","Which wave diffracts most through the same gap?",["Short wavelength","Long wavelength","High frequency","Fast speed only"],1,1]]},
 {t:"Sound",i:[
  ["In a sound wave a compression is where particles are squashed together and a rarefaction is where they are spread apart.","What is a rarefaction?",["Particles squashed together","Particles spread apart","A reflection","A loud sound"],1,1],
  ["Humans hear 20 Hz to 20 000 Hz. Sound needs a medium to travel through.","Which of these cannot carry sound?",["Steel","Water","A vacuum","Air"],2],
  ["An echo is reflected sound. Distance = speed × time ÷ 2 for the round trip.","Sound (330 m/s) returns from a cliff after 2 s. How far away is the cliff?",["660 m","330 m","165 m","1320 m"],1],
  ["Higher frequency means higher pitch. Larger amplitude means a louder sound.","A louder sound of the same note has a greater…",["Frequency","Wavelength","Speed","Amplitude"],3]]},
 {t:"Light and the EM spectrum",i:[
  ["Light bends towards the normal when it slows down, for example entering glass from air.","Light enters glass from air at an angle. It bends…",["away from the normal","towards the normal","not at all","back into the air"],1],
  ["EM spectrum, low to high frequency: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.","Which has the highest frequency?",["Infrared","Radio waves","Ultraviolet","Gamma rays"],3]]},
 {t:"Reflection and total internal reflection",i:[
  ["In reflection, the angle of incidence equals the angle of reflection, both measured from the normal.","A ray hits a plane mirror with an angle of incidence of 35°. What is the angle of reflection?",["55°","70°","35°","90°"],2],
  ["Total internal reflection happens when light in a dense material meets the boundary at more than the critical angle. Optical fibres use it.","What is needed for total internal reflection?",["Angle of incidence below the critical angle","Angle of incidence above the critical angle","Light moving from air to glass","A silver coating"],1],
  ["Critical angle: n = 1 ÷ sin c.","Glass has n = 2.0. What is sin c for a glass–air boundary?",["2.0","1.0","4.0","0.5"],3,1]]},
 {t:"Refraction of light",i:[
  ["Refraction is a change in direction when light changes speed at a boundary. Entering a denser material slows light and bends it towards the normal.","A ray goes from air into glass. How do its speed and direction change?",["Faster, towards the normal","Slower, towards the normal","Slower, away from the normal","Faster, away from the normal"],1],
  ["Refractive index n = sin i ÷ sin r. A higher n means light travels more slowly in the material.","A ray has i = 45° and r = 30°. What is n?",["0.71","1.4","1.5","0.67"],1,1],
  ["The speed of light in a material = c ÷ n, where c = 3.0 × 10⁸ m/s.","Glass has n = 1.5. What is the speed of light in it?",["4.5 × 10⁸ m/s","2.0 × 10⁸ m/s","1.5 × 10⁸ m/s","3.0 × 10⁸ m/s"],1,1]]},
 {t:"Dispersion and colour",i:[
  ["White light splits into colours in a glass prism because each colour is refracted by a different amount. Violet bends most and red least.","Which colour is bent the most by a prism?",["Red","Green","Yellow","Violet"],3],
  ["The visible spectrum in order of increasing frequency: red, orange, yellow, green, blue, indigo, violet.","Which colour has the lowest frequency?",["Violet","Blue","Red","Green"],2],
  ["Visible light of a single frequency is called monochromatic.","What is monochromatic light?",["Light of many colours","Light of a single frequency","White light","Infrared radiation"],1,1]]},
 {t:"Lenses",i:[
  ["A converging lens brings parallel rays to a focus. The focal length is the distance from the lens to that focus.","What does a converging lens do to a parallel beam of light?",["Spreads it out","Brings it to a focus","Reflects it","Stops it"],1],
  ["A converging lens used as a magnifying glass, with the object closer than the focal length, makes an upright, enlarged, virtual image.","Which type of image does a magnifying glass produce?",["Real and inverted","Virtual and upright","Real and upright","Virtual and inverted"],1,1],
  ["A converging lens forms a real, inverted, diminished image when the object is beyond 2f. Between f and 2f the image is real, inverted and enlarged.","An object is far beyond 2f from a converging lens. The image is…",["Virtual, upright, enlarged","Real, inverted, diminished","Real, upright, enlarged","Virtual, inverted, diminished"],1],
  ["The focal length is the distance from the lens to the principal focus. A thicker, more curved lens has a shorter focal length.","A lens has a focal length of 10 cm. How far from the lens do parallel rays meet?",["5 cm","10 cm","20 cm","100 cm"],1],
  ["A diverging lens spreads parallel rays out and only forms virtual, upright, diminished images.","Which lens always gives a virtual, upright, diminished image?",["Converging","Diverging","Prism","Plane mirror"],1,1],
  ["Short-sightedness is corrected with a diverging lens. Long-sightedness is corrected with a converging lens.","Which lens corrects short-sightedness?",["Diverging","Converging","Plane","Cylindrical"],0,1]]},
 {t:"Uses of EM waves",i:[
  ["Microwaves are used for satellite TV, mobile phones and ovens. Infrared is used for remote controls and thermal imaging. X-rays are used for medical scans.","Which radiation is used in a TV remote control?",["Ultraviolet","Infrared","X-rays","Gamma rays"],1],
  ["Too much UV causes skin cancer and eye damage. X-rays and gamma rays damage cells. Microwaves heat body cells.","Which radiation can cause skin cancer?",["Radio waves","Infrared","Ultraviolet","Visible light"],2],
  ["All EM waves travel at 3.0 × 10⁸ m/s in a vacuum. Higher frequency means shorter wavelength.","Which EM wave has the shortest wavelength?",["Radio","Microwave","X-ray","Gamma ray"],3]]},
 {t:"Communication and signals",i:[
  ["Mobile phones use microwaves because they pass through some walls and need only a short aerial. Bluetooth uses radio waves.","Why do mobile phones use microwaves?",["They need a very long aerial","They can penetrate some walls","They travel at the speed of sound","They are visible"],1,1],
  ["Optical fibres carry light or infrared using total internal reflection. They carry data at high rates for broadband and cable TV.","How does light stay inside an optical fibre?",["Total internal reflection","Diffraction","Dispersion","Absorption"],0],
  ["Digital signals have only two values, on or off, so they can be regenerated accurately. Analogue signals vary continuously and pick up noise.","Why are digital signals better over long distances?",["They can be regenerated without noise","They need no power","They travel faster than light","They are louder"],0,1],
  ["A geostationary satellite orbits above the equator once every 24 hours, so it stays over one point on Earth. Satellite TV uses them.","What is special about a geostationary satellite?",["It orbits very low","It stays above the same point on Earth","It orbits the Moon","It never moves"],1]]},
 {t:"Ultrasound and sonar",i:[
  ["Ultrasound is sound with a frequency above 20 000 Hz, beyond human hearing.","What is ultrasound?",["Sound below 20 Hz","Sound above 20 000 Hz","Very loud sound","Radio waves"],1],
  ["Sonar sends out ultrasound and times the echo. Depth = speed × time ÷ 2.","A sonar pulse returns after 0.20 s. Sound travels at 1500 m/s in water. How deep is the sea?",["300 m","150 m","75 m","3000 m"],1,1],
  ["Ultrasound is used to scan soft tissue, such as an unborn baby, and to find cracks in materials.","Which is a use of ultrasound?",["Cooking food","Killing cancer cells","Scanning an unborn baby","Sending TV signals"],2],
  ["Sound travels fastest in solids, slower in liquids and slowest in gases, because particles are closer together in solids.","In which material does sound travel fastest?",["Air","Water","Steel","A vacuum"],2]]}]},
{n:"Electricity and magnetism",d:"Circuits, resistance, power, safety and electromagnetic effects",k:["Describe magnets, poles and field lines","Use I = Q ÷ t, V = IR, P = IV and E = IVt","Combine resistors in series and parallel","Explain mains safety, fuses and earthing","Describe electromagnetic induction, motors and transformers"],f:"I = Q ÷ t, V = IR, P = IV, E = IVt, Vp ÷ Vs = Np ÷ Ns, IpVp = IsVs",l:[
 {t:"Magnetism",i:[
  ["Like poles repel and unlike poles attract. Field lines run from the north pole to the south pole outside a magnet.","Two north poles are brought close together. What happens?",["They attract","They repel","Nothing","They swap poles"],1],
  ["Soft iron makes a temporary magnet. Steel makes a permanent magnet.","Which material is used for the core of an electromagnet?",["Steel","Copper","Soft iron","Plastic"],2]]},
 {t:"Electric charge",i:[
  ["Rubbing two insulators transfers electrons from one to the other. The one that gains electrons becomes negative and the one that loses them becomes positive.","A cloth rubs a rod and the rod becomes negatively charged. What moved?",["Protons moved to the rod","Electrons moved to the rod","Electrons moved to the cloth","Neutrons moved to the rod"],1],
  ["Like charges repel and opposite charges attract. Metals conduct because they contain free electrons.","Which pair of charges will attract each other?",["Positive and positive","Negative and negative","Positive and negative","Neutral and neutral"],2],
  ["An electric field is a region where a charge feels a force. Its direction is the direction of the force on a positive charge.","What is the direction of an electric field at a point?",["Force on a negative charge","Force on a positive charge","Towards the nearest wall","Always upwards"],1,1]]},
 {t:"Current, voltage and resistance",i:[
  ["Resistance is directly proportional to length and inversely proportional to cross-sectional area. Area is proportional to diameter squared.","A wire is replaced by one twice as long with half the diameter. By what factor does the resistance change?",["× 2","× 4","× 8","× 16"],2,1],
  ["Resistance R = V ÷ I. Electrical power P = IV.","A 12 V supply drives a current through a 4 Ω resistor. What is the current?",["48 A","3 A","8 A","0.33 A"],1],
  ["Current is the charge passing a point per unit time: I = Q ÷ t.","6 C of charge passes a point in 2 s. What is the current?",["12 A","4 A","0.33 A","3 A"],3,1]]},
 {t:"Circuits and electrical energy",i:[
  ["A series circuit has one path with the same current everywhere. In a parallel circuit the current splits between branches.","In a parallel circuit, how does the source current compare with the current in one branch?",["Smaller","The same","Larger","Zero"],2],
  ["Electrical energy E = Pt. The kilowatt-hour is power in kW × time in hours.","A 2 kW heater runs for 3 hours. How many kWh is that?",["1.5 kWh","6 kWh","0.67 kWh","5 kWh"],1],
  ["A filament lamp’s I–V graph curves because its resistance rises as the filament heats up.","Why does a filament lamp’s resistance increase with current?",["The wire gets shorter","The wire gets thicker","The filament gets hotter","The voltage falls"],2,1]]},
 {t:"Series circuits and mains safety",i:[
  ["In series, resistances add: R = R₁ + R₂. In parallel, the combined resistance is less than either resistor.","What is the total resistance of a 5 Ω and a 10 Ω resistor in series?",["15 Ω","3.3 Ω","50 Ω","5 Ω"],0],
  ["Fuses and switches go in the live wire so the appliance is made safe when switched off or when a fault occurs.","Where must a fuse be connected in a mains circuit?",["Neutral wire","Earth wire","Live wire","Any wire"],2]]},
 {t:"Electromagnetic induction",i:[
  ["Moving a wire across a magnetic field, or changing the field through a coil, induces an e.m.f. A faster change or a stronger magnet gives a bigger e.m.f.","How can you increase the induced e.m.f. in a coil?",["Move the magnet faster","Use a weaker magnet","Keep the magnet still","Remove the coil"],0],
  ["An a.c. generator spins a coil in a magnetic field. Slip rings and brushes connect the rotating coil to the circuit.","What do the slip rings do in an a.c. generator?",["Make the coil spin","Connect the rotating coil to the circuit","Strengthen the magnet","Change a.c. to d.c."],1,1]]},
 {t:"Transformers and motors",i:[
  ["For an ideal transformer IpVp = IsVs. A step-down transformer has a larger current in the secondary.","An ideal transformer has 1000 primary turns and 500 secondary turns. The secondary current is 0.4 A. What is the primary current?",["0.2 A","0.4 A","0.8 A","0.1 A"],0,1],
  ["A transformer changes voltage using coils on an iron core: Vp ÷ Vs = Np ÷ Ns. It only works with a.c.","A transformer has 100 primary turns, 500 secondary turns and a 12 V input. What is the output voltage?",["2.4 V","60 V","600 V","112 V"],1],
  ["High-voltage transmission lowers the current, so less energy is lost as heat in the cables.","Why are power lines run at very high voltage?",["Higher current gives less loss","Cables are cheaper","Lower current means less power loss","Transformers are not needed"],2],
  ["A current-carrying wire in a magnetic field experiences a force. This is how a motor turns.","What does a current-carrying wire in a magnetic field experience?",["A change in mass","A force","Cooling","Nothing"],1]]}]},
{n:"Nuclear physics",d:"The atom, radioactivity and half-life",k:["Describe the nuclear atom and use nuclide notation","Compare alpha, beta and gamma radiation","Use half-life and corrected count rate","Explain uses and safety precautions"],f:"neutrons = A − Z, fraction left = (½)ⁿ",l:[
 {t:"Atoms and nuclei",i:[
  ["Nucleon number A = protons + neutrons. Proton number Z = protons. So neutrons = A − Z.","Uranium-238 has proton number 92. How many neutrons does it have?",["92","146","238","330"],1],
  ["Protons are +1, neutrons 0 and electrons −1. A neutral atom has equal numbers of protons and electrons.","A neutral atom has 11 protons and 12 neutrons. How many electrons does it have?",["12","23","11","1"],2],
  ["Isotopes are atoms of the same element with different numbers of neutrons.","Which describes a pair of isotopes?",["Same neutrons, different protons","Same protons, different neutrons","Same nucleon number, different elements","Different protons and neutrons"],1],
  ["In alpha scattering most particles pass straight through and a few bounce back, so the atom is mostly empty space with a small, dense, positive nucleus.","What does the alpha scattering experiment show?",["Atoms are solid spheres","Electrons sit in the nucleus","Neutrons are charged","A small, dense, positive nucleus"],3,1]]},
 {t:"Types of radiation and half-life",i:[
  ["If 12.5% remains, three half-lives have passed (100, 50, 25, 12.5). Divide the time by 3.","12.5% of a sample remains after 90 years. What is the half-life?",["45 years","30 years","22.5 years","11.3 years"],1,1],
  ["Alpha is the most ionising but least penetrating. Gamma is the least ionising but most penetrating.","Which radiation is stopped by a sheet of paper?",["Gamma","Beta","Alpha","All of them"],2],
  ["After each half-life, half of the undecayed nuclei remain.","A 80 g sample has a half-life of 2 days. How much is left after 6 days?",["40 g","20 g","10 g","26.7 g"],2]]},
 {t:"Detecting and using radiation",i:[
  ["Decay is spontaneous and random. Background radiation comes from rocks, radon gas, food and cosmic rays.","A counter reads 45 counts/min with a source and 5 counts/min background. What is the corrected count rate?",["50 counts/min","40 counts/min","9 counts/min","225 counts/min"],1,1],
  ["Gamma rays are the most penetrating, so they are used to sterilise equipment. Ionising radiation can cause cell damage and cancer.","Which radiation is best for sterilising medical equipment?",["Alpha","Beta","Gamma","Ultraviolet"],2],
  ["In beta decay a neutron turns into a proton and an electron, so the proton number goes up by 1.","After beta decay, what happens to the nucleus?",["Nucleon number falls by 4","Proton number rises by 1","Proton number falls by 2","Nothing changes"],1,1]]}]},
{n:"Space physics",d:"The Earth, Solar System, stars and the Universe",k:["Explain day, night, seasons and the Moon’s phases","Describe the Solar System and gravity","Calculate light travel time and orbital speed","Describe the life cycle of stars","Explain redshift, the Big Bang and the Hubble constant"],f:"t = d ÷ c, v = 2πr ÷ T, H₀ = v ÷ d",l:[
 {t:"Earth and the Solar System",i:[
  ["Time = distance ÷ speed. Light travels at 3.0 × 10⁸ m/s.","The Sun is 1.5 × 10¹¹ m away. How long does its light take to reach Earth?",["50 s","5000 s","500 s","0.002 s"],2],
  ["The Earth orbits the Sun once in about 365 days, and its tilted axis causes the seasons.","What causes the seasons on Earth?",["Distance from the Sun only","Earth’s tilted axis as it orbits the Sun","The Moon’s orbit","Earth’s spin speed"],1],
  ["The Solar System has one star, eight planets, dwarf planets, moons, asteroids and comets. The four inner planets are small and rocky.","Which planet is closest to the Sun?",["Venus","Earth","Mercury","Mars"],2],
  ["The Earth spins once in about 24 hours. The Moon orbits Earth about once a month, giving the phases.","What causes day and night?",["Earth orbiting the Sun","The Moon’s orbit","The Sun moving around Earth","Earth spinning on its axis"],3],
  ["Average orbital speed v = 2πr ÷ T.","A planet orbits at radius 1.5 × 10¹¹ m with period 3.2 × 10⁷ s. What is its speed (2 s.f.)?",["2.9 × 10⁴ m/s","1.5 × 10⁴ m/s","5.9 × 10³ m/s","2.9 × 10⁷ m/s"],0,1]]},
 {t:"The Sun and the Universe",i:[
  ["Stable stars like the Sun are powered by nuclear fusion in their cores.","In a stable star, what is fused?",["Helium into hydrogen","Uranium into lead","Hydrogen into helium","Carbon into iron"],2,1],
  ["Light from distant galaxies is redshifted: its wavelength increases because they are moving away.","Redshift of distant galaxies is evidence that…",["the Universe is expanding","stars are cooling","the Sun is moving","galaxies are shrinking"],0],
  ["The Sun is a medium-sized star made mostly of hydrogen and helium. A light-year is the distance light travels in one year.","What is a light-year a unit of?",["Time","Speed","Distance","Brightness"],2]]},
 {t:"Life of a star and the Hubble constant",i:[
  ["A protostar becomes a stable star when gravity’s inward pull balances the outward force from the hot core. Massive stars end as supernovae.","What does a red supergiant become when it explodes?",["A white dwarf","A planetary nebula","A protostar","A supernova"],3,1],
  ["Hubble constant H₀ = v ÷ d.","A galaxy recedes at 2.2 × 10⁶ m/s and is 1.0 × 10²⁴ m away. What is H₀?",["2.2 × 10⁻¹⁸ s⁻¹","2.2 × 10³⁰ s⁻¹","4.5 × 10⁻¹⁹ s⁻¹","2.2 × 10¹⁸ s⁻¹"],0,1]]}]},
{n:"Experimental skills",d:"Practical Papers 5 and 6: planning, measuring and evaluating",k:["Identify independent, dependent and control variables","Read instruments and spot zero errors","Record results in tables with units","Plot graphs, draw best-fit lines and find gradients","Evaluate methods and suggest improvements"],f:"gradient = rise ÷ run, mean = total ÷ number of readings, results agree if within ± 10%",l:[
 {t:"Planning an investigation",i:[
  ["The independent variable is the one you change. The dependent variable is the one you measure. Control variables stay the same so the test is fair.","You change the length of a wire and measure its resistance. What is the independent variable?",["Resistance","Length","Current","Temperature"],1],
  ["Repeat readings and take the mean to improve reliability. Use at least five values across a suitable range.","Why repeat a measurement and take the mean?",["To make results more reliable","To change the variable","To remove all errors","To save time"],0]]},
 {t:"Results, graphs and errors",i:[
  ["Read scales to half a division. Check for zero error before you start, then correct for it.","A newtonmeter reads 0.2 N with nothing attached. This is a…",["Random error","Anomaly","Zero error","Control variable"],2],
  ["Draw a best-fit line through the points, ignoring anomalies. Find the gradient with a large triangle.","What is an anomaly?",["A result that fits the pattern","A result outside the general pattern","The mean of the readings","A control variable"],1]]}]}
];

"Earth and the Solar System":"Orbit~the curved path of an object around a star or planet;Light-year~distance light travels in one year;Dwarf planet~a small body orbiting the Sun that is not a moon, such as Pluto",
"The Sun and the Universe":"Galaxy~a group of billions of stars;Redshift~increase in observed wavelength from a receding source;Big Bang~the theory that the Universe began from a single point and has expanded since",
"Life of a star and the Hubble constant":"Protostar~a collapsing cloud of gas and dust;Supernova~the explosion of a red supergiant;Hubble constant~speed of recession ÷ distance of a galaxy;CMBR~cosmic microwave background radiation left over from the early Universe",
"Planning an investigation":"Independent variable~the variable you change;Dependent variable~the variable you measure;Control variable~a variable kept constant for a fair test",

const N={
"Particle model and gases":`<p>Everything is made of tiny particles. Their arrangement and movement explain solids, liquids and gases.</p><svg class='d' viewBox='0 0 420 125' role='img' aria-label='Particles in a solid, a liquid and a gas'><rect x='10' y='5' width='120' height='90'/><rect x='150' y='5' width='120' height='90'/><rect x='290' y='5' width='120' height='90'/><path d='M30 25h.1M50 25h.1M70 25h.1M90 25h.1M110 25h.1M30 45h.1M50 45h.1M70 45h.1M90 45h.1M110 45h.1M30 65h.1M50 65h.1M70 65h.1M90 65h.1M110 65h.1M30 85h.1M50 85h.1M70 85h.1M90 85h.1M110 85h.1M170 85h.1M186 80h.1M202 86h.1M218 80h.1M234 85h.1M250 80h.1M178 68h.1M196 66h.1M214 70h.1M232 66h.1M246 62h.1M186 52h.1M206 50h.1M226 52h.1M312 20h.1M380 30h.1M340 55h.1M300 80h.1M390 75h.1M355 85h.1' stroke-linecap='round' style='stroke-width:9'/><text x='12' y='112' style='font-size:11px'>Solid: fixed, vibrate</text><text x='152' y='112' style='font-size:11px'>Liquid: slide past</text><text x='292' y='112' style='font-size:11px'>Gas: far apart, fast</text></svg><p><b>Gas pressure</b> is caused by particles hitting the walls of the container. Heating a gas at constant volume makes the particles faster, so they hit harder and more often and the pressure rises. Squashing a gas at constant temperature makes collisions more frequent: pV = constant (Extended). <b>Absolute zero</b> is −273 °C (0 K), where particles have the least kinetic energy. Convert with T = θ + 273.</p><p><b>Brownian motion:</b> smoke or pollen grains jiggle randomly because fast, invisible molecules keep hitting them from all sides. This is evidence that particles exist and move.</p>`,
"Thermal expansion and heat capacity":`<p>Heated particles vibrate or move more, so they take up more room. Gases expand the most and solids the least. Uses and problems: gaps in rails and bridges, thermostats with bimetallic strips, liquid in a thermometer.</p><p><b>Internal energy</b> is the total energy of the particles. Heating raises their average kinetic energy, so the temperature rises. <b>Specific heat capacity</b> c is the energy needed to raise 1 kg of a substance by 1 °C: c = ΔE ÷ (mΔθ) (Extended). Example: heating 2 kg of water (c = 4200 J/(kg °C)) by 20 °C needs 2 × 4200 × 20 = 168 000 J. Water has a high c, so it warms and cools slowly.</p>`,
"Heat transfer":`<p><b>Conduction</b> passes energy along a solid as particles vibrate. In metals, free electrons carry energy quickly, so metals are good conductors. Gases and most liquids are poor conductors because the particles are far apart. <b>Convection</b> happens in fluids: warm fluid expands, becomes less dense and rises while cooler, denser fluid sinks. <b>Radiation</b> is infrared that needs no medium.</p><ul class='ki'><li>Dull black surfaces are the best absorbers and emitters of infrared.</li><li>Shiny white surfaces are the best reflectors and the worst emitters.</li><li>A hotter or larger surface emits more radiation.</li><li>An object at constant temperature emits energy as fast as it absorbs it. If it absorbs more than it emits, it warms up.</li></ul><p>A vacuum flask has a vacuum (no conduction or convection) and shiny walls (little radiation).</p>`,
"Evaporation and boiling":`<p><b>Melting</b> and <b>boiling</b> need energy but the temperature stays constant during the change of state (water melts at 0 °C and boils at 100 °C). The energy breaks the attractions between particles instead of making them faster. <b>Evaporation</b> happens at the surface at any temperature: the most energetic particles escape, so the liquid cools. It is faster when it is hotter, with a larger surface area and with moving air. <b>Boiling</b> happens throughout the liquid at its boiling point, with bubbles of vapour. <b>Condensation</b> and <b>solidification</b> release energy.</p>`,
"Magnetism":`<p>Like poles repel and unlike poles attract. A magnet attracts magnetic materials (iron, steel, nickel, cobalt). <b>Induced magnetism</b> is when a magnetic material becomes a magnet near a magnet. Soft iron is magnetised and demagnetised easily (temporary magnets, electromagnet cores). Steel keeps its magnetism (permanent magnets).</p><svg class='d' viewBox='0 -30 420 180' role='img' aria-label='Magnetic field lines around a bar magnet'><rect x='170' y='60' width='40' height='30' style='fill:#1f5eff'/><rect x='210' y='60' width='40' height='30' style='fill:#e5484d'/><text x='184' y='80' style='fill:#fff'>S</text><text x='224' y='80' style='fill:#fff'>N</text><path class='r' d='M250 68 C330 10 90 10 170 68'/><path class='r' d='M250 68 C380 -30 40 -30 170 68'/><path class='r' d='M250 82 C330 140 90 140 170 82'/><path class='r' d='M250 82 C380 180 40 180 170 82'/><polygon points='206,24 216,19 216,29' style='fill:var(--ink)'/><polygon points='206,126 216,121 216,131' style='fill:var(--ink)'/></svg><p>A magnetic field is a region where a magnetic pole feels a force. Its direction is the direction of the force on a north pole, so field lines run from N to S. Lines are closer together where the field is stronger. Plot a field with a plotting compass or iron filings.</p>`,
"Electric charge":`<p>Rubbing transfers <b>electrons</b> (negative charge) from one insulator to another. The material that gains electrons becomes negative and the one that loses them becomes positive. Like charges repel and unlike charges attract. Conductors (metals) have free electrons and let charge flow. Insulators (plastic, glass, rubber) do not. Charge is measured in coulombs (C).</p><p>An <b>electric field</b> is a region where a charge feels a force. Its direction is the direction of the force on a positive charge, so field lines point away from positive charges and towards negative charges.</p>`,
"Current, voltage and resistance":`<p><b>Current</b> I is the flow of charge: I = Q ÷ t (amperes). In metals free electrons flow from negative to positive, but <b>conventional current</b> is drawn from positive to negative. A cell gives an e.m.f. and the <b>potential difference</b> V across a component is the energy transferred per unit charge. Connect an ammeter in series and a voltmeter in parallel.</p><p><b>Resistance</b> R = V ÷ I (ohms, Ω). A longer wire has more resistance and a thicker wire has less. For a fixed resistor V is proportional to I. A filament lamp’s graph curves because the filament heats up. A diode conducts in one direction only.</p>`,
"Circuits and electrical energy":`<ul class='ki'><li>Series: same current everywhere, p.d.s add, resistances add (R = R₁ + R₂).</li><li>Parallel: current splits at junctions, the same p.d. across each branch, and the combined resistance is smaller than any one branch.</li></ul><svg class='d' viewBox='0 0 420 150' role='img' aria-label='A series circuit and a parallel circuit'><path d='M20 30H150V120H20Z'/><circle cx='60' cy='30' r='10' class='b'/><circle cx='110' cy='30' r='10' class='b'/><line x1='14' y1='70' x2='26' y2='70'/><line x1='17' y1='80' x2='23' y2='80'/><text x='40' y='145'>series: one loop</text><path d='M240 30H400V120H240Z'/><line x1='300' y1='30' x2='300' y2='120'/><line x1='360' y1='30' x2='360' y2='120'/><circle cx='300' cy='75' r='10' class='b'/><circle cx='360' cy='75' r='10' class='b'/><line x1='234' y1='70' x2='246' y2='70'/><line x1='237' y1='80' x2='243' y2='80'/><text x='260' y='145'>parallel: branches</text></svg><p>Power P = IV and energy E = IVt (= Pt). The kilowatt-hour is the energy used by a 1 kW device in 1 hour, and cost = kWh × price per kWh. Example: a 2 kW heater for 3 h uses 6 kWh, so at 20 p per kWh it costs 120 p. Lamps are wired in parallel so each gets the full voltage and one failing does not stop the others.</p>`,
"Wave properties":`<p>A wave transfers <b>energy</b> from place to place without transferring matter. In a <b>transverse</b> wave the vibration is at right angles to the direction of travel (light, water waves, S-waves). In a <b>longitudinal</b> wave it is parallel to the direction of travel (sound, P-waves).</p><svg class='d' viewBox='0 0 420 150' role='img' aria-label='Transverse wave showing crest, trough, wavelength and amplitude'><line class='g' x1='10' y1='75' x2='410' y2='75'/><path d='M10 75 C40 15 80 15 110 75 S180 135 210 75 S280 15 310 75 S380 135 410 75'/><line class='r' x1='60' y1='10' x2='260' y2='10'/><text x='130' y='28'>wavelength</text><line class='r' x1='262' y1='31' x2='262' y2='75'/><text x='268' y='24'>amplitude</text><text x='36' y='24'>crest</text><text x='140' y='146'>trough</text></svg><p>Wave speed: <b>v = fλ</b>. Frequency f is the number of waves per second (hertz) and the period is T = 1 ÷ f. When a wave is reflected or refracted its <b>frequency does not change</b>.</p><h3 class='sub'>Longitudinal waves</h3><svg class='d' viewBox='0 0 420 110' role='img' aria-label='Longitudinal wave with compressions and rarefactions'><path d='M20 30v40M50 30v40M62 30v40M72 30v40M82 30v40M92 30v40M120 30v40M160 30v40M200 30v40M228 30v40M250 30v40M262 30v40M272 30v40M282 30v40M292 30v40M320 30v40M360 30v40M400 30v40'/><text x='77' y='22' text-anchor='middle'>compression</text><text x='180' y='22' text-anchor='middle'>rarefaction</text><line class='r' x1='10' y1='90' x2='400' y2='90'/><text x='210' y='106' text-anchor='middle'>direction of travel</text></svg><p>Each line is a layer of particles. They vibrate back and forth <b>parallel</b> to the direction the wave travels.</p><h3 class='sub'>Worked examples</h3><ul class='ki'><li>f = 20 Hz and λ = 1.5 m: v = fλ = 20 × 1.5 = <b>30 m/s</b>.</li><li>v = 340 m/s and f = 85 Hz: λ = v ÷ f = <b>4.0 m</b>.</li><li>A float bobs up and down 5 times in 10 s: f = 0.5 Hz and T = 1 ÷ 0.5 = <b>2 s</b>.</li></ul><h3 class='sub'>Exam tips</h3><p>Measure wavelength between two matching points, such as crest to crest. Amplitude is measured from the rest line, not from trough to crest. A wave transfers energy, never matter.</p><h3 class='sub'>Syllabus checklist (3.1)</h3><ul class='ki'><li>Describe wave motion using ropes, springs and water waves.</li><li>Describe wavefront, wavelength, frequency, crest (peak), trough, amplitude and wave speed.</li><li>Recall and use v = fλ.</li><li>Transverse: vibration at right angles to travel (EM waves, water waves, seismic S-waves).</li><li>Longitudinal: vibration parallel to travel (sound, seismic P-waves).</li><li>Describe how waves can be reflected at a plane surface, refracted (change of speed) and diffracted through a narrow gap.</li></ul>`,
"Diffraction and ripple tanks":`<p>A <b>ripple tank</b> is a shallow tray of water with a vibrating bar that makes straight wavefronts. It shows reflection from a barrier, refraction when the depth changes (waves slow down and the wavelength shortens in shallow water) and diffraction.</p><svg class='d' viewBox='0 0 420 130' role='img' aria-label='Straight waves spreading out after a narrow gap'><line x1='150' y1='0' x2='150' y2='50'/><line x1='150' y1='80' x2='150' y2='130'/><line class='r' x1='40' y1='8' x2='40' y2='122'/><line class='r' x1='80' y1='8' x2='80' y2='122'/><line class='r' x1='120' y1='8' x2='120' y2='122'/><path class='r' d='M176 34 A40 40 0 0 1 176 96'/><path class='r' d='M195 11 A70 70 0 0 1 195 119'/><path class='r' d='M228 10 A95 95 0 0 1 228 120'/><text x='252' y='68'>waves spread out</text></svg><p><b>Diffraction</b> is the spreading of a wave as it passes through a gap or around an edge. It is greatest when the gap is about the same size as the wavelength, and longer wavelengths diffract more. The wavelength and frequency stay the same after the gap.</p><ul class='ki'><li>Gap much wider than the wavelength: very little spreading.</li><li>Gap about the same as the wavelength: strong spreading into circular waves.</li><li>Edge: waves bend into the shadow, more so for longer wavelengths.</li></ul><svg class='d' viewBox='0 0 420 130' role='img' aria-label='Waves passing through a wide gap with little diffraction'><line x1='150' y1='0' x2='150' y2='20'/><line x1='150' y1='110' x2='150' y2='130'/><line class='r' x1='40' y1='8' x2='40' y2='122'/><line class='r' x1='80' y1='8' x2='80' y2='122'/><line class='r' x1='120' y1='8' x2='120' y2='122'/><line class='r' x1='190' y1='24' x2='190' y2='106'/><line class='r' x1='230' y1='24' x2='230' y2='106'/><text x='255' y='68'>wide gap: little spreading</text></svg><h3 class='sub'>Refraction in a ripple tank</h3><svg class='d' viewBox='0 0 420 130' role='img' aria-label='Wavefronts closer together in shallow water'><rect class='b' x='210' y='0' width='210' height='130'/><line class='g' x1='210' y1='0' x2='210' y2='130'/><line class='r' x1='30' y1='10' x2='70' y2='110'/><line class='r' x1='80' y1='10' x2='120' y2='110'/><line class='r' x1='130' y1='10' x2='170' y2='110'/><line class='r' x1='235' y1='10' x2='255' y2='110'/><line class='r' x1='265' y1='10' x2='285' y2='110'/><line class='r' x1='295' y1='10' x2='315' y2='110'/><line class='r' x1='325' y1='10' x2='345' y2='110'/><text x='20' y='126' style='font-size:12px'>deep: fast, long wavelength</text><text x='225' y='126' style='font-size:12px'>shallow: slow, short wavelength</text></svg><p>In shallow water the waves slow down, the wavelength shortens, the frequency stays the same and the wavefronts turn towards the normal.</p><h3 class='sub'>Syllabus checklist (3.1)</h3><ul class='ki'><li>Describe how a ripple tank shows reflection at a plane surface, refraction due to a change in depth, diffraction at a gap and diffraction at an edge.</li><li>Extended: describe how wavelength and gap size affect diffraction through a gap.</li><li>Extended: describe how wavelength affects diffraction at an edge.</li></ul>`,
"Sound":`<p>Sound is made by vibrating objects and travels as a <b>longitudinal</b> wave. Where particles are squashed together there is a <b>compression</b>, and where they are spread out there is a <b>rarefaction</b>. Sound needs a medium, so it cannot travel through a vacuum. It travels fastest in solids, slower in liquids and slowest in gases (about 330 to 350 m/s in air).</p><p>A larger <b>amplitude</b> means a louder sound and a higher <b>frequency</b> means a higher pitch. Humans hear from 20 Hz to 20 000 Hz. An echo is reflected sound, and the speed of sound can be found from v = 2d ÷ t using an echo from a distant wall.</p><svg class='d' viewBox='0 0 420 230' role='img' aria-label='Traces of a note, a louder note and a higher pitched note'><text x='10' y='14'>Original note</text><path d='M10 45q20 -36 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0'/><text x='10' y='80'>Louder: larger amplitude</text><path d='M10 125q20 -64 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0'/><text x='10' y='172'>Higher pitch: higher frequency</text><path d='M10 205q10 -36 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0'/></svg><h3 class='sub'>Speed of sound</h3><ul class='ki'><li>Air: about 340 m/s</li><li>Water: about 1500 m/s</li><li>Steel: about 5000 m/s</li></ul><p>Particles are closer together in solids, so vibrations pass on faster. Example: an echo returns after 2.0 s, so the wall is 340 × 2.0 ÷ 2 = <b>340 m</b> away.</p><h3 class='sub'>Syllabus checklist (3.4)</h3><ul class='ki'><li>Describe sound produced by vibrating sources and its longitudinal nature.</li><li>Human hearing range is 20 Hz to 20 000 Hz. Sound needs a medium. Speed in air is about 330 to 350 m/s.</li><li>Describe a method of finding the speed of sound in air using distance and time.</li><li>Describe how amplitude affects loudness and frequency affects pitch. An echo is reflected sound.</li><li>Extended: describe compression and rarefaction.</li><li>Extended: sound generally travels faster in solids than liquids, and faster in liquids than gases.</li></ul>`,
"Light and the EM spectrum":`<p>All electromagnetic waves are transverse, can travel through a vacuum and travel at 3.0 × 10⁸ m/s there. Moving from radio waves to gamma rays the frequency increases and the wavelength decreases.</p><svg class='d' viewBox='0 0 420 90' role='img' aria-label='Electromagnetic spectrum from radio waves to gamma rays'><rect x='1' y='8' width='58' height='34'/><rect x='61' y='8' width='58' height='34'/><rect x='121' y='8' width='58' height='34'/><rect class='b' x='181' y='8' width='58' height='34'/><rect x='241' y='8' width='58' height='34'/><rect x='301' y='8' width='58' height='34'/><rect x='361' y='8' width='58' height='34'/><text x='30' y='30' text-anchor='middle' style='font-size:11px'>Radio</text><text x='90' y='30' text-anchor='middle' style='font-size:11px'>Micro</text><text x='150' y='30' text-anchor='middle' style='font-size:11px'>Infrared</text><text x='210' y='30' text-anchor='middle' style='font-size:11px'>Visible</text><text x='270' y='30' text-anchor='middle' style='font-size:11px'>UV</text><text x='330' y='30' text-anchor='middle' style='font-size:11px'>X-ray</text><text x='390' y='30' text-anchor='middle' style='font-size:11px'>Gamma</text><line class='r' x1='10' y1='60' x2='410' y2='60'/><text x='210' y='82' text-anchor='middle'>low frequency, long wavelength → high frequency, short wavelength</text></svg><p>The higher the frequency, the more energy the wave carries and the more harm it can do to living cells.</p><h3 class='sub'>Properties shared by all EM waves</h3><ul class='ki'><li>They are transverse waves.</li><li>They travel at 3.0 × 10⁸ m/s in a vacuum (almost the same in air).</li><li>They transfer energy and need no medium.</li><li>They can be reflected, refracted and diffracted.</li></ul><p>Example: a radio wave has f = 2.0 × 10⁵ Hz, so λ = v ÷ f = 3.0 × 10⁸ ÷ 2.0 × 10⁵ = <b>1500 m</b>. Memory aid for the order: <i>Raging Martians Invaded Venus Using X-ray Guns</i>.</p><h3 class='sub'>Syllabus checklist (3.3)</h3><ul class='ki'><li>Know the main regions of the EM spectrum in order of frequency and wavelength.</li><li>All EM waves travel at the same high speed in a vacuum.</li><li>Extended: the speed is 3.0 × 10⁸ m/s and is about the same in air.</li><li>Describe uses and the harmful effects of each region (see the Uses of EM waves topic).</li></ul>`,
"Reflection and total internal reflection":`<p>The <b>normal</b> is a line at right angles to the surface. In reflection the angle of incidence equals the angle of reflection (<b>i = r</b>), both measured from the normal. An image in a plane mirror is virtual, the same size as the object and as far behind the mirror as the object is in front.</p><svg class='d' viewBox='0 0 420 130' role='img' aria-label='Ray reflecting from a plane mirror'><line x1='40' y1='110' x2='380' y2='110' style='stroke-width:5'/><line class='g' x1='210' y1='110' x2='210' y2='10'/><line class='r' x1='100' y1='20' x2='210' y2='110'/><line class='r' x1='210' y1='110' x2='320' y2='20'/><text x='216' y='20'>normal</text><text x='188' y='84'>i</text><text x='222' y='84'>r</text><text x='50' y='126'>plane mirror</text></svg><p><b>Total internal reflection</b> happens when light travels from a denser material towards a less dense one and the angle of incidence is bigger than the critical angle c. All the light is reflected back inside. Optical fibres and prisms in binoculars use it, and n = 1 ÷ sin c.</p><svg class='d' viewBox='0 0 420 130' role='img' aria-label='Image formed by a plane mirror'><line x1='210' y1='5' x2='210' y2='125' style='stroke-width:5'/><line x1='110' y1='100' x2='110' y2='60'/><line class='g' x1='310' y1='100' x2='310' y2='60'/><line class='g' x1='110' y1='80' x2='310' y2='80'/><text x='70' y='118'>object</text><text x='250' y='118'>virtual image</text><text x='158' y='72'>d</text><text x='256' y='72'>d</text></svg><svg class='d' viewBox='0 0 420 150' role='img' aria-label='Rays inside glass at, below and above the critical angle'><rect class='b' x='0' y='75' width='420' height='75'/><line x1='0' y1='75' x2='420' y2='75'/><line class='g' x1='210' y1='10' x2='210' y2='140'/><line class='r' x1='180' y1='140' x2='210' y2='75'/><line class='r' x1='210' y1='75' x2='300' y2='20'/><line class='r' x1='151' y1='140' x2='210' y2='75'/><line class='r' x1='210' y1='75' x2='300' y2='75'/><line class='r' x1='98' y1='140' x2='210' y2='75'/><line class='r' x1='210' y1='75' x2='300' y2='127'/><text x='306' y='24'>i &lt; c</text><text x='306' y='68'>i = c</text><text x='225' y='146' style='font-size:12px'>i &gt; c: total internal reflection</text><text x='10' y='40'>air</text><text x='10' y='140'>glass</text></svg><p>Example: glass with n = 1.5 has sin c = 1 ÷ 1.5 = 0.667, so c = <b>42°</b>. A ray inside the glass meeting the surface at more than 42° is totally internally reflected.</p><h3 class='sub'>Syllabus checklist (3.2.1 and 3.2.2)</h3><ul class='ki'><li>Define and use the normal, angle of incidence and angle of reflection.</li><li>Describe the image in a plane mirror: same size, same distance behind the mirror, virtual.</li><li>State and use i = r.</li><li>Extended: use simple constructions, measurements and calculations for reflection by plane mirrors (draw the normal, measure from it, and find the image by extending reflected rays backwards).</li><li>State the meaning of critical angle and describe internal reflection and total internal reflection with experimental and everyday examples.</li><li>Extended: n = 1 ÷ sin c, and optical fibres in telecommunications.</li></ul>`,
"Refraction of light":`<p>Light bends at a boundary because its speed changes. Entering a denser material (air to glass) it slows down and bends <b>towards the normal</b>. Leaving it speeds up and bends away from the normal. A ray along the normal does not bend.</p><svg class='d' viewBox='0 0 420 150' role='img' aria-label='Ray bending towards the normal in glass'><rect class='b' x='100' y='75' width='220' height='70'/><line class='g' x1='170' y1='15' x2='170' y2='145'/><line class='r' x1='90' y1='15' x2='170' y2='75'/><line class='r' x1='170' y1='75' x2='212' y2='145'/><text x='148' y='45'>i</text><text x='178' y='115'>r</text><text x='20' y='40'>air</text><text x='255' y='100'>glass</text></svg><p>Refractive index <b>n = sin i ÷ sin r</b> = speed in a vacuum ÷ speed in the material. Glass has n of about 1.5, so light travels at about 2.0 × 10⁸ m/s in it. Example: i = 45° and r = 30° gives n = 0.707 ÷ 0.5 = 1.4.</p><svg class='d' viewBox='0 0 420 150' role='img' aria-label='Ray passing through a glass slab and emerging parallel'><rect class='b' x='100' y='50' width='220' height='50'/><line class='g' x1='170' y1='15' x2='170' y2='85'/><line class='g' x1='205' y1='65' x2='205' y2='135'/><line class='r' x1='90' y1='10' x2='170' y2='50'/><line class='r' x1='170' y1='50' x2='205' y2='100'/><line class='r' x1='205' y1='100' x2='285' y2='140'/><text x='14' y='34'>incident ray</text><text x='290' y='132'>emergent ray</text><text x='240' y='80'>glass</text></svg><p>The emergent ray is <b>parallel</b> to the incident ray but shifted sideways. Typical refractive indices: water 1.33, glass 1.5, diamond 2.4. Light travels more slowly in the material with the larger n.</p><h3 class='sub'>Syllabus checklist (3.2.2)</h3><ul class='ki'><li>Define and use the normal, angle of incidence and angle of refraction.</li><li>Describe an experiment showing refraction of light by transparent blocks of different shapes (rectangular, semicircular, triangular).</li><li>Describe the passage of light through a transparent material (limited to boundaries between two media).</li><li>Extended: refractive index is the ratio of the speeds of a wave in two regions. Use n = sin i ÷ sin r.</li></ul>`,
"Dispersion and colour":`<p>White light is a mixture of colours. A glass prism refracts each colour by a different amount, so the colours spread into a spectrum. This is <b>dispersion</b>. Violet is refracted the most and red the least.</p><svg class='d' viewBox='0 0 420 140' role='img' aria-label='White light dispersed by a prism'><polygon class='b' points='170,125 230,25 290,125'/><line x1='40' y1='100' x2='206' y2='65'/><line x1='206' y1='65' x2='254' y2='65'/><line x1='254' y1='65' x2='400' y2='85' style='stroke:#e5484d'/><line x1='254' y1='65' x2='400' y2='105' style='stroke:#17874f'/><line x1='254' y1='65' x2='400' y2='125' style='stroke:#7c3aed'/><text x='30' y='92'>white light</text><text x='350' y='68'>red</text><text x='350' y='138'>violet</text></svg><p>Order: red, orange, yellow, green, blue, indigo, violet (frequency increases and wavelength decreases along the list). Light of a single frequency is <b>monochromatic</b>.</p><svg class='d' viewBox='0 0 420 90' role='img' aria-label='Colours of the visible spectrum'><rect x='10' y='8' width='57' height='34' style='fill:#e5484d;stroke:none'/><rect x='67' y='8' width='57' height='34' style='fill:#f08a24;stroke:none'/><rect x='124' y='8' width='57' height='34' style='fill:#f5c518;stroke:none'/><rect x='181' y='8' width='57' height='34' style='fill:#17874f;stroke:none'/><rect x='238' y='8' width='57' height='34' style='fill:#1f5eff;stroke:none'/><rect x='295' y='8' width='57' height='34' style='fill:#3b2fb5;stroke:none'/><rect x='352' y='8' width='57' height='34' style='fill:#7c3aed;stroke:none'/><text x='38' y='58' text-anchor='middle' style='font-size:11px'>red</text><text x='95' y='58' text-anchor='middle' style='font-size:11px'>orange</text><text x='152' y='58' text-anchor='middle' style='font-size:11px'>yellow</text><text x='209' y='58' text-anchor='middle' style='font-size:11px'>green</text><text x='266' y='58' text-anchor='middle' style='font-size:11px'>blue</text><text x='323' y='58' text-anchor='middle' style='font-size:11px'>indigo</text><text x='380' y='58' text-anchor='middle' style='font-size:11px'>violet</text><text x='210' y='82' text-anchor='middle'>frequency increases →</text></svg><p>Red light has a wavelength of about 700 nm and violet about 400 nm (1 nm = 10⁻⁹ m). A rainbow forms when raindrops disperse sunlight.</p><h3 class='sub'>Syllabus checklist (3.2.4)</h3><ul class='ki'><li>Describe dispersion as shown by a glass prism refracting white light.</li><li>Know the traditional seven colours in order of frequency and wavelength.</li><li>Extended: visible light of a single frequency is monochromatic.</li></ul>`,
"Lenses":`<p>A <b>converging (convex) lens</b> brings parallel rays together at the principal focus F. The focal length is the distance from the lens to F. A <b>diverging lens</b> spreads parallel rays out so they appear to come from a virtual focus.</p><svg class='d' viewBox='0 0 420 140' role='img' aria-label='Ray diagram for a converging lens'><line class='g' x1='10' y1='70' x2='410' y2='70'/><path class='b' d='M210 10 Q240 70 210 130 Q180 70 210 10Z'/><line x1='130' y1='64' x2='130' y2='76'/><line x1='290' y1='64' x2='290' y2='76'/><line x1='40' y1='70' x2='40' y2='30'/><line class='r' x1='40' y1='30' x2='210' y2='30'/><line class='r' x1='210' y1='30' x2='361' y2='105'/><line class='r' x1='40' y1='30' x2='361' y2='105'/><line x1='361' y1='70' x2='361' y2='105'/><text x='14' y='92'>object</text><text x='335' y='60'>image</text><text x='126' y='92'>F</text><text x='286' y='92'>F</text><text x='196' y='138'>lens</text></svg><p>To draw an image use two rays from the top of the object: one parallel to the axis that bends through F, and one through the centre of the lens that does not bend. They meet at the image. Object beyond 2F: real, inverted, diminished. Between F and 2F: real, inverted, enlarged. Inside F: virtual, upright, enlarged (a magnifying glass). Long-sightedness is corrected with a converging lens and short-sightedness with a diverging lens.</p><h3 class='sub'>Where the image forms</h3><ul class='ki'><li><b>Beyond 2F:</b> real, inverted, diminished (camera).</li><li><b>At 2F:</b> real, inverted, same size.</li><li><b>Between F and 2F:</b> real, inverted, enlarged (projector).</li><li><b>Inside F:</b> virtual, upright, enlarged (magnifying glass).</li></ul><p>A <b>real</b> image can be projected onto a screen. A <b>virtual</b> image cannot, because the rays only appear to come from it.</p><h3 class='sub'>Diverging lens</h3><svg class='d' viewBox='0 0 420 140' role='img' aria-label='Parallel rays spreading out after a diverging lens'><line class='g' x1='10' y1='70' x2='410' y2='70'/><path class='b' d='M190 10 Q210 70 190 130 L230 130 Q210 70 230 10Z'/><line class='r' x1='30' y1='50' x2='210' y2='50'/><line class='r' x1='30' y1='90' x2='210' y2='90'/><line class='r' x1='210' y1='50' x2='330' y2='23'/><line class='r' x1='210' y1='90' x2='330' y2='117'/><line class='g' x1='210' y1='50' x2='120' y2='70'/><line class='g' x1='210' y1='90' x2='120' y2='70'/><text x='70' y='92'>virtual F</text></svg><h3 class='sub'>Magnifying glass</h3><svg class='d' viewBox='0 0 420 140' role='img' aria-label='Magnifying glass forming a virtual enlarged image'><line class='g' x1='10' y1='70' x2='410' y2='70'/><path class='b' d='M210 10 Q240 70 210 130 Q180 70 210 10Z'/><line x1='170' y1='70' x2='170' y2='40'/><line class='r' x1='170' y1='40' x2='210' y2='40'/><line class='r' x1='210' y1='40' x2='380' y2='104'/><line class='r' x1='170' y1='40' x2='290' y2='130'/><line class='g' x1='210' y1='40' x2='130' y2='10'/><line class='g' x1='170' y1='40' x2='130' y2='10'/><line class='g' x1='130' y1='70' x2='130' y2='10'/><text x='148' y='92'>object</text><text x='20' y='30'>virtual image</text></svg><p>The object is inside the focal length, so the rays spread out after the lens. Traced backwards they meet to form an upright, enlarged, virtual image.</p><h3 class='sub'>Lens vocabulary</h3><ul class='ki'><li><b>Principal axis:</b> the line through the centre of the lens at right angles to it.</li><li><b>Optical centre:</b> the middle of the lens. A ray through it is not bent.</li><li><b>Principal focus (F):</b> where rays parallel to the axis meet after a converging lens. There is one on each side.</li><li><b>Focal length (f):</b> the distance from the optical centre to F.</li><li><b>Power:</b> a lens with f = 0.10 m has power +10 D (P = 1 ÷ f). A diverging lens has negative power.</li></ul><h3 class='sub'>Drawing a ray diagram step by step</h3><ol class='ki'><li>Draw the principal axis and the lens, and mark F and 2F on both sides.</li><li>Draw the object as an arrow standing on the axis.</li><li>From the top of the object draw ray 1 parallel to the axis. After the lens it passes through F.</li><li>From the same point draw ray 2 through the centre of the lens in a straight line.</li><li>Where the two rays cross is the top of the image. Drop a line to the axis.</li><li>Describe the image: real or virtual, upright or inverted, enlarged or diminished.</li></ol><h3 class='sub'>Object at 2F</h3><svg class='d' viewBox='0 0 420 140' role='img' aria-label='Object at 2F gives a real inverted image of the same size'><line class='g' x1='10' y1='70' x2='410' y2='70'/><path class='b' d='M210 10 Q240 70 210 130 Q180 70 210 10Z'/><line x1='130' y1='64' x2='130' y2='76'/><line x1='290' y1='64' x2='290' y2='76'/><line x1='50' y1='70' x2='50' y2='40'/><line class='r' x1='50' y1='40' x2='210' y2='40'/><line class='r' x1='210' y1='40' x2='370' y2='100'/><line class='r' x1='50' y1='40' x2='370' y2='100'/><line x1='370' y1='70' x2='370' y2='100'/><text x='126' y='92'>F</text><text x='286' y='92'>F</text><text x='34' y='92'>2F</text><text x='350' y='62'>2F</text><text x='120' y='16'>real, inverted, same size</text></svg><h3 class='sub'>Object between F and 2F</h3><svg class='d' viewBox='0 0 400 150' role='img' aria-label='Object between F and 2F gives a real inverted enlarged image'><line class='g' x1='10' y1='70' x2='390' y2='70'/><path class='b' d='M150 10 Q180 70 150 130 Q120 70 150 10Z'/><line x1='90' y1='64' x2='90' y2='76'/><line x1='210' y1='64' x2='210' y2='76'/><line x1='30' y1='64' x2='30' y2='76'/><line x1='270' y1='64' x2='270' y2='76'/><line x1='60' y1='70' x2='60' y2='40'/><line class='r' x1='60' y1='40' x2='150' y2='40'/><line class='r' x1='150' y1='40' x2='330' y2='130'/><line class='r' x1='60' y1='40' x2='330' y2='130'/><line x1='330' y1='70' x2='330' y2='130'/><text x='86' y='90'>F</text><text x='206' y='90'>F</text><text x='24' y='90'>2F</text><text x='264' y='90'>2F</text><text x='230' y='24'>real, inverted, enlarged</text></svg><h3 class='sub'>Correcting sight</h3><p>A <b>short-sighted</b> person sees near objects clearly but distant objects are blurred, because the eye focuses light in front of the retina. A diverging lens spreads the rays slightly so the eye focuses them on the retina.</p><svg class='d' viewBox='0 0 420 140' role='img' aria-label='Short-sighted eye focusing in front of the retina'><ellipse class='b' cx='270' cy='70' rx='90' ry='55' style='stroke:var(--ink);stroke-width:2'/><path d='M335 30 Q360 70 335 110' style='stroke-width:4'/><ellipse cx='190' cy='70' rx='8' ry='28' style='fill:none;stroke:var(--ink);stroke-width:2'/><line class='r' x1='20' y1='52' x2='190' y2='52'/><line class='r' x1='20' y1='88' x2='190' y2='88'/><line class='r' x1='190' y1='52' x2='300' y2='70'/><line class='r' x1='190' y1='88' x2='300' y2='70'/><line class='r' x1='300' y1='70' x2='335' y2='80'/><line class='r' x1='300' y1='70' x2='335' y2='60'/><text x='10' y='18'>short-sighted eye</text><text x='200' y='134' style='font-size:12px'>focus in front of the retina</text></svg><p>A <b>long-sighted</b> person sees distant objects clearly but near objects are blurred, because the light would focus behind the retina. A converging lens brings the rays together a little earlier.</p><svg class='d' viewBox='0 0 420 140' role='img' aria-label='Long-sighted eye focusing behind the retina'><ellipse class='b' cx='270' cy='70' rx='90' ry='55' style='stroke:var(--ink);stroke-width:2'/><path d='M335 30 Q360 70 335 110' style='stroke-width:4'/><ellipse cx='190' cy='70' rx='8' ry='28' style='fill:none;stroke:var(--ink);stroke-width:2'/><line class='r' x1='20' y1='52' x2='190' y2='52'/><line class='r' x1='20' y1='88' x2='190' y2='88'/><line class='r' x1='190' y1='52' x2='335' y2='64'/><line class='r' x1='190' y1='88' x2='335' y2='76'/><line class='g' x1='335' y1='64' x2='385' y2='70'/><line class='g' x1='335' y1='76' x2='385' y2='70'/><text x='10' y='18'>long-sighted eye</text><text x='200' y='134' style='font-size:12px'>focus behind the retina</text></svg><p>Scale diagrams: draw the rays to scale and measure. If a ray from the top of the object parallel to the axis crosses the axis 4.0 cm from the lens, then f = 4.0 cm. The image distance is measured from the lens to the image arrow.</p><h3 class='sub'>Syllabus checklist (3.2.3)</h3><ul class='ki'><li>Describe the action of thin converging and diverging lenses on a parallel beam of light.</li><li>Define and use focal length, principal axis and principal focus.</li><li>Draw and use ray diagrams for a real image formed by a converging lens.</li><li>Describe images using enlarged, same size, diminished, upright, inverted, real and virtual.</li><li>Know a virtual image forms where diverging rays are extrapolated backwards and cannot be projected on a screen.</li><li>Extended: ray diagrams for a virtual image, the single lens as a magnifying glass, and correcting long- and short-sightedness.</li></ul>`,
"Uses of EM waves":`<p>Each region of the spectrum has uses that match its properties.</p><ul class='ki'><li><b>Radio waves:</b> radio and TV broadcasting, astronomy, RFID.</li><li><b>Microwaves:</b> satellite TV, mobile phones, microwave ovens.</li><li><b>Infrared:</b> grills, remote controls, intruder alarms, thermal imaging.</li><li><b>Visible light:</b> vision, photography, lighting.</li><li><b>Ultraviolet:</b> security marking, detecting fake notes, sterilising water.</li><li><b>X-rays:</b> medical scans and security scanners.</li><li><b>Gamma rays:</b> sterilising food and equipment, treating cancer.</li></ul><p>Dangers: microwaves heat body cells, infrared causes burns, ultraviolet damages skin and eyes, and X-rays and gamma rays damage cells and cause mutations.</p><h3 class='sub'>Why each wave suits its job</h3><ul class='ki'><li>Microwaves pass through the atmosphere and some walls, so they suit satellites and phones.</li><li>Infrared is emitted by warm objects, so it suits thermal imaging.</li><li>Ultraviolet makes security marks glow.</li><li>X-rays pass through soft tissue but are absorbed by bone.</li><li>Gamma rays are very penetrating and kill bacteria and cancer cells.</li></ul><h3 class='sub'>Syllabus checklist (3.3)</h3><ul class='ki'><li>Radio waves: broadcasting, astronomy, RFID. Microwaves: satellite TV, mobile phones, ovens.</li><li>Infrared: grills, remote controls, intruder alarms, thermal imaging, optical fibres. Visible: vision, photography, illumination.</li><li>Ultraviolet: security marking, fake notes, sterilising water. X-rays: scanning. Gamma: sterilising, detecting and treating cancer.</li><li>Harmful effects: microwaves heat cells, infrared burns, ultraviolet damages cells and eyes (skin cancer), X-rays and gamma cause mutation or cell damage.</li></ul>`,
"Communication and signals":`<p>Satellite communication uses microwaves. <b>Geostationary</b> satellites orbit above the equator once every 24 hours, so they stay over one point and are used for satellite TV. Low-orbit satellites are used by some satellite phones. Mobile phones use microwaves because they pass through some walls and need only a short aerial. Bluetooth uses radio waves.</p><p><b>Optical fibres</b> carry light or infrared by total internal reflection and can carry very high rates of data. An <b>analogue</b> signal varies continuously and picks up noise as it travels. A <b>digital</b> signal has only two states, so it can be regenerated accurately and carries more data over longer distances.</p><svg class='d' viewBox='0 0 420 110' role='img' aria-label='Light reflecting along an optical fibre'><rect class='b' x='10' y='35' width='400' height='40'/><path class='r' d='M20 55 L80 38 L140 72 L200 38 L260 72 L320 38 L380 72 L410 56'/><text x='10' y='25'>optical fibre: total internal reflection at the edges</text><text x='10' y='100'>pulses of light or infrared carry the data</text></svg><svg class='d' viewBox='0 0 420 120' role='img' aria-label='Analogue and digital signals'><text x='10' y='14'>Analogue</text><path d='M10 50q20 -36 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0'/><text x='10' y='82'>Digital</text><path d='M10 112h40v-24h40v24h40v-24h40v24h40v-24h40v24h40v-24h40'/></svg><p>Repeater stations can clean up and regenerate a digital signal. Noise picked up by an analogue signal is amplified along with it and cannot be removed.</p><h3 class='sub'>Syllabus checklist (3.3)</h3><ul class='ki'><li>Communication with artificial satellites is mainly by microwaves. Some satellite phones use low-orbit satellites. Some satellite phones and satellite TV use geostationary satellites.</li><li>Extended: mobile phones and wireless internet use microwaves (they penetrate some walls and need a short aerial). Bluetooth uses radio waves (they pass through walls but are weakened).</li><li>Extended: optical fibres (visible light or infrared) are used for cable TV and broadband because glass is transparent to them and they carry high data rates.</li><li>Extended: know the difference between analogue and digital signals, that sound can be sent either way, and the benefits of digital: faster data rates and longer range through accurate regeneration.</li></ul>`,
"Ultrasound and sonar":`<p><b>Ultrasound</b> is sound with a frequency above 20 000 Hz. It is used to scan soft tissue (such as an unborn baby) and to find cracks inside materials, because it is partly reflected at boundaries.</p><p><b>Sonar</b> sends out ultrasound and times the echo. Because the pulse travels there and back, <b>distance = speed × time ÷ 2</b>. Example: an echo returns after 0.20 s in water where sound travels at 1500 m/s, so the depth is 1500 × 0.20 ÷ 2 = 150 m.</p><svg class='d' viewBox='0 0 420 140' role='img' aria-label='Sonar pulse reflecting from the sea bed'><line x1='10' y1='30' x2='410' y2='30'/><polygon points='170,12 250,12 235,30 185,30' style='fill:var(--tint)'/><line class='r' x1='200' y1='34' x2='200' y2='116'/><line class='r' x1='220' y1='116' x2='220' y2='34' style='stroke-dasharray:5 4'/><path d='M10 120 Q100 110 200 122 T410 118'/><text x='240' y='75'>depth d = v × t ÷ 2</text><text x='14' y='24'>sea surface</text><text x='14' y='138'>sea bed</text></svg><p>Ultrasound is used for non-destructive testing (finding cracks in metal), for scanning soft tissue and in sonar by ships. It is safer than X-rays because it is not ionising.</p><h3 class='sub'>Syllabus checklist (3.4)</h3><ul class='ki'><li>Define ultrasound as sound with a frequency higher than 20 kHz.</li><li>Extended: describe uses of ultrasound in non-destructive testing, scanning soft tissue and sonar, including calculating depth or distance from time and wave speed.</li></ul>`};

function learn(){
 return `<h1>Cambridge IGCSE Physics 0625</h1><p class="mut">Follow each path from top to bottom: short lessons first, then the purple unit test for double XP. Lessons and questions tagged Extended are Supplement content, so Core students can skip them.</p>`+
 U.map(unitHtml).join("");
}
function unitHtml(u,ui){
 const L=u.l,tot=L.length+1,dn=L.filter((l,i)=>st.done[ui+"."+i]).length+(st.done["t"+ui]?1:0),nx=L.findIndex((l,i)=>!st.done[ui+"."+i]);
 const nd=(c,i,dot,t,s,f)=>`<button class="node ${c}" style="--o:${[0,40,0,-40][i%4]}px" onclick="${f}"><span class="dot">${dot}</span><b>${t}</b><small>${s}</small></button>`;
 return `<section class="unit"><h2>${ui+1}. ${u.n}</h2><p class="mut">${u.d}</p><div class="up" role="img" aria-label="${dn} of ${tot} complete"><i style="width:${dn/tot*100}%"></i></div><p class="mut">${dn} of ${tot} complete</p><div class="path">`+
 L.map((l,i)=>{const d=st.done[ui+"."+i];return nd(d?"done":i==nx?"next":"",i,d?"✓":i+1,l.t,d?"Done":(i==nx?"Up next, ":"")+l.i.length+" questions","topic("+ui+","+i+")")}).join("")+
 nd("test",L.length,"★","Unit test",st.done["t"+ui]?"Passed, 2× XP":"Mixed test, 2× XP","utest("+ui+")")+`</div></section>`;
}
const timed=()=>!S.key||S.m>1;
function pw(){
 if(!timed())return "";
 S.left=25;setTimeout(tick,0);
 const v=iv(),b=k=>`<button class="buff ${k}" id="p_${k}" onclick="usePw('${k}')" ${v[k]?"":"disabled"} title="${PD[k][2]}"><span class="bi">${PD[k][0]}</span><span class="bt"><b>${PD[k][1]}</b><small>${PD[k][2]}</small></span><span class="bc" id="c_${k}">${v[k]}</span></button>`;
 return `<div class="tbar"><span class="tm" id="tm">25s</span><div class="tl"><i id="tf" style="width:100%"></i></div></div><div class="buffs">${b("freeze")}${b("fifty")}${b("skip")}</div>`;
}
function tick(){
 clearInterval(S.iv);const i0=S.i;
 S.iv=setInterval(()=>{if(S.i!=i0||S.chk){clearInterval(S.iv);return}
  if(S.frz>0)S.frz--;else S.left--;
  const e=$("#tm");if(e)e.textContent=(S.frz>0?"❄ ":"")+S.left+"s";const tf=$("#tf");if(tf){tf.style.width=Math.max(S.left,0)/25*100+"%";tf.parentNode.classList.toggle("fz",S.frz>0)}
  if(S.left<=0){clearInterval(S.iv);if(S.sel==null)S.sel=-1;check()}},1000)}
function usePw(k){
