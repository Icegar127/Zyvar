function lensLab(){
 const pos=[[24,'Beyond 2F'],[20,'At 2F'],[15,'Between F and 2F'],[10,'At F'],[6,'Inside F']].map(x=>`<button class='pill' onclick='LAB.u=${x[0]};labDraw()'>${x[1]}</button>`).join('');
 return `<div class='tb'><button class='pill' onclick='PJ=null;render()'>← All projects</button><h1 style='margin-top:14px'>Lens Lab: convex and concave lenses</h1><div class='box'><b>In this chapter you will:</b> describe how convex and concave lenses act on light, define principal axis, principal focus and focal length, predict the image for every object position, and test your predictions with the interactive model.</div>
<h2>1. What is a lens?</h2><p>A lens is a piece of transparent glass or plastic with curved surfaces. Light refracts when it enters and leaves the lens, so a beam changes direction. A thin lens is drawn as a single line on a ray diagram.</p><svg class='d' viewBox='0 0 420 150' role='img' aria-label='A convex lens converging rays and a concave lens diverging rays'><path class='b' d='M105 15 Q130 75 105 135 Q80 75 105 15Z'/><line class='r' x1='10' y1='45' x2='105' y2='45'/><line class='r' x1='10' y1='75' x2='185' y2='75'/><line class='r' x1='10' y1='105' x2='105' y2='105'/><line class='r' x1='105' y1='45' x2='185' y2='75'/><line class='r' x1='105' y1='105' x2='185' y2='75'/><text x='172' y='96'>F</text><text x='20' y='146'>convex: rays converge</text><path class='b' d='M295 15 Q315 75 295 135 L335 135 Q315 75 335 15Z'/><line class='r' x1='220' y1='45' x2='315' y2='45'/><line class='r' x1='220' y1='75' x2='400' y2='75'/><line class='r' x1='220' y1='105' x2='315' y2='105'/><line class='r' x1='315' y1='45' x2='400' y2='18'/><line class='r' x1='315' y1='105' x2='400' y2='132'/><line class='g' x1='315' y1='45' x2='255' y2='75'/><line class='g' x1='315' y1='105' x2='255' y2='75'/><text x='238' y='96'>virtual F</text><text x='215' y='146'>concave: rays diverge</text></svg>
<h2>2. Key terms</h2><ul class='ki'><li><b>Principal axis:</b> the line through the centre of the lens at right angles to it.</li><li><b>Optical centre:</b> the middle of the lens. Rays through it are not bent.</li><li><b>Principal focus F:</b> where rays parallel to the axis meet (convex) or appear to come from (concave). There is one on each side.</li><li><b>Focal length f:</b> the distance from the optical centre to F. 2F is twice that distance.</li></ul>
<h2>3. Convex (converging) lens</h2><p>A convex lens is thicker in the middle. It brings parallel rays together at a real focus on the far side. Three rays are easy to draw: (1) a ray parallel to the axis passes through F after the lens, (2) a ray through the optical centre goes straight on, and (3) a ray through the near F leaves parallel to the axis. Where rays cross, a <b>real image</b> forms. It can be shown on a screen.</p>
<h2>4. Concave (diverging) lens</h2><p>A concave lens is thinner in the middle. It spreads parallel rays out so they seem to come from a virtual focus on the incoming side. A ray parallel to the axis leaves as if from F, and a ray through the centre goes straight on. The rays never cross, so the image is always <b>virtual</b>, upright and diminished, between the lens and F.</p>
<h2>5. Image position and object position</h2><div class='tw'><table><thead><tr><th>Object (convex)</th><th>Image position</th><th>Type</th><th>Orientation</th><th>Size</th><th>Use</th></tr></thead><tbody><tr><td>Beyond 2F</td><td>Between F and 2F</td><td>Real</td><td>Inverted</td><td>Diminished</td><td>Camera, eye</td></tr><tr><td>At 2F</td><td>At 2F</td><td>Real</td><td>Inverted</td><td>Same size</td><td>Photocopier</td></tr><tr><td>Between F and 2F</td><td>Beyond 2F</td><td>Real</td><td>Inverted</td><td>Enlarged</td><td>Projector</td></tr><tr><td>At F</td><td>At infinity</td><td>No image</td><td>-</td><td>-</td><td>Spotlight</td></tr><tr><td>Inside F</td><td>Same side as object</td><td>Virtual</td><td>Upright</td><td>Enlarged</td><td>Magnifying glass</td></tr><tr><td>Concave, anywhere</td><td>Between lens and F</td><td>Virtual</td><td>Upright</td><td>Diminished</td><td>Correcting short sight</td></tr></tbody></table></div>
<h2>6. Interactive model</h2><p>Choose a lens and move the object. Solid blue rays are real rays. Grey dashed lines are extensions that show where a virtual image is. Here f = 10 cm.</p><div class='lc'><select id='lt' aria-label='Lens type' onchange='LAB.t=this.value;labDraw()'><option value='convex'>Convex lens</option><option value='concave'>Concave lens</option></select><input type='range' id='lu' min='4' max='30' step='0.5' value='${LAB.u}' aria-label='Object distance' oninput='LAB.u=+this.value;labDraw()'><b id='luv'></b></div><div class='lc'>${pos}</div><svg class='d' id='ls' viewBox='0 0 600 260' style='max-width:680px' role='img' aria-label='Interactive lens ray diagram'></svg><div class='box' id='lo'></div>
<h2>7. Worked examples</h2><ul class='ki'><li>f = 10 cm, object 24 cm away. This is beyond 2F (20 cm), so the image is real, inverted, diminished and between F and 2F. The lens formula 1 ÷ v = 1 ÷ f − 1 ÷ u gives v = 17 cm. (The formula is beyond the syllabus, but it checks your drawing.)</li><li>f = 10 cm, object 6 cm away. This is inside F, so the image is virtual, upright and enlarged. v = −15 cm (15 cm on the object side), magnification = 15 ÷ 6 = 2.5.</li><li>Scale diagram: draw the rays accurately, measure where a ray parallel to the axis crosses the axis to find f, and measure image distance from the lens.</li></ul>
<h2>8. Lenses in everyday devices</h2><ul class='ki'><li><b>Camera:</b> object beyond 2F gives a small, real, inverted image on the sensor.</li><li><b>Projector:</b> the slide sits between F and 2F, so a large, real, inverted image forms on a distant screen. The slide is loaded upside down.</li><li><b>Magnifying glass:</b> object inside F gives a virtual, upright, enlarged image. The closer the object is to F, the larger the image.</li><li><b>Human eye:</b> a flexible convex lens focuses a real, inverted image on the retina.</li><li><b>Spectacles:</b> a converging lens for long sight and a diverging lens for short sight.</li></ul>
<h2>9. Reasoning without calculating</h2><div class='box'><b>Logic rules.</b> (1) Real images are always inverted and can be shown on a screen. Virtual images are always upright. (2) As a real object moves towards a convex lens, its real image moves away and grows. (3) A concave lens can never make a real image. (4) If the object is inside F, the image is on the same side as the object. (5) The focal length belongs to the lens and does not change when the object moves.</div><p>Covering half of a lens does not remove half of the image. Every part of the lens forms the whole image, so the image stays complete but becomes dimmer because fewer rays reach it.</p>
<h2>10. Common mistakes</h2><ul class='ki'><li>Bending the rays at the object instead of at the lens line.</li><li>Forgetting that virtual images are drawn with dashed lines.</li><li>Mixing up convex (converging) and concave (diverging).</li><li>Writing “bigger” instead of “enlarged”, or leaving out real or virtual.</li></ul>
<h2>11. Summary</h2><ul class='ki'><li>Convex lenses converge light. Concave lenses diverge light.</li><li>The image from a convex lens depends on where the object is compared with F and 2F.</li><li>Only a convex lens can make a real image. A concave lens always makes a virtual, upright, diminished image.</li></ul><h2>12. Challenge questions</h2><p>These need reasoning, not recall. Everything you need is in this chapter and the Waves syllabus.</p>${chHtml()}<button class='go' onclick='startL()'>Open the Lenses topic and practice</button></div>`;

function topic(u,l){
 const L=U[u].l[l];TP={u,l,h:[]};ov.className="on";
 ov.innerHTML=`<div class="top"><button class="x" onclick="closeO()" aria-label="Close">×</button><p class="ttl" style="margin:0">${U[u].n}</p></div><div class="body"><h1>${L.t}</h1><h2>Key definitions</h2><dl>${defs(L.t)}</dl>${N[L.t]?`<h2>Study notes</h2><div class="notes">${N[L.t]}</div>`:""}<h2>Key ideas</h2><ul class="ki">${L.i.map(x=>`<li>${x[0]}</li>`).join("")}</ul><button class="go" onclick="lesson(${u},${l})">Start practice (${L.i.length} questions)</button>${prevTP(u,l)?` <button class="pill" onclick="topic(${prevTP(u,l)[0]},${prevTP(u,l)[1]})">← Previous checkpoint</button>`:""}${nextTP(u,l)?` <button class="pill" onclick="topic(${nextTP(u,l)[0]},${nextTP(u,l)[1]})">Next checkpoint →</button>`:""}${L.t=="Lenses"?` <button class="pill" onclick="closeO();project('lens')">Open the Lens Lab project</button>`:""}<h2 style="margin-top:28px">Detailed explanation</h2><div id="ex" class="teach">Want a fuller walkthrough with a worked example? <button class="pill" onclick="explain()">Explain in detail</button></div><h2 style="margin-top:28px">Ask the tutor</h2><div id="ch"></div><div class="cin"><input id="ci" placeholder="Ask a question about this topic" aria-label="Your question" onkeydown="if(event.key==='Enter')ask()"><button class="go" style="width:auto;padding:10px 18px" onclick="ask()">Send</button></div></div>`;
}
const ctx=()=>{const L=U[TP.u].l[TP.l];return INS+"\n\nTopic: "+L.t+" (unit: "+U[TP.u].n+")\nKey ideas the student has seen:\n"+L.i.map(x=>x[0]).join("\n")};
async function explain(){
 const e=$("#ex");e.textContent="Writing your explanation…";
 try{await ai(ctx()+"\n\nWrite a detailed explanation of this topic in about 250 words: what it means, why it matters, the key equations with units, one fully worked example and one common exam mistake. Say clearly which parts are Extended (Supplement) only.",r=>{e.textContent=r.text})}catch(x){e.textContent=fail(x)}
}
async function ask(){
 const i=$("#ci"),q=i.value.trim();if(!q)return;i.value="";
 const c=$("#ch"),add=(w,t)=>{const d=document.createElement("div");d.className="m "+w;d.textContent=t;c.append(d);d.scrollIntoView({block:"nearest"});return d};
 add("s",q);const a=add("a","Thinking…");TP.h.push("Student: "+q);
 try{const r=await ai(ctx()+"\n\nConversation so far:\n"+TP.h.slice(-8).join("\n")+"\nTutor:",t=>{a.textContent=t.text});TP.h.push("Tutor: "+r.text)}catch(x){a.textContent=fail(x)}
}
function lesson(u,l){run(its(U[u].l[l]),1,U[u].l[l].t,u+"."+l)}
function qz(u){
 const all=(u<0?U:[U[u]]).flatMap(x=>x.l.flatMap(its));
 run(shuf(all).slice(0,10),0,u<0?"Mixed quiz":"Quiz: "+U[u].n,null);
}
function run(items,teach,title,key,m){S={m:m||1,items,teach,title,key,i:0,ok:0,sel:null,chk:0};ov.className="on"+(m>1?" t":"");step()}
function step(){
 const it=S.items[S.i];S.sel=null;S.chk=0;clearInterval(S.iv);S.frz=0;
 if(!it)return fin();
 ov.innerHTML=`<div class="top"><button class="x" onclick="closeO()" aria-label="Close">×</button><div class="bar"><i style="width:${S.i/S.items.length*100}%"></i></div></div>
 <div class="body"><p class="ttl">${S.title}${it[4]?'<span class="tag">Extended</span>':""}</p>${S.teach?`<div class="teach">${it[0]}</div>`:""}<h3>${it[1]}</h3><div class="opts">${it[2].map((o,j)=>`<button class="opt" onclick="pick(${j})">${o}</button>`).join("")}</div></div>
 <div class="foot" id="ft"><div>${pw()}<p class="fb" id="fb" hidden></p><button class="go" id="go" disabled onclick="check()">Check</button></div></div>`;
}
function pick(j){
 if(S.chk)return;S.sel=j;
 document.querySelectorAll(".opt").forEach((b,k)=>b.className="opt"+(k==j?" sel":""));
 $("#go").disabled=false;
}
function check(){
 if(S.chk){S.i++;return step()}
 S.chk=1;const it=S.items[S.i],good=S.sel==it[3];
 if(good)S.ok++;
 document.querySelectorAll(".opt").forEach((b,k)=>{b.className="opt"+(k==it[3]?" ok":k==S.sel?" no":"")});
 $("#ft").className="foot "+(good?"ok":"bad");
 const f=$("#fb");f.hidden=false;f.textContent=good?"Correct":"Not quite. The answer is “"+it[2][it[3]]+"”.";
 $("#go").textContent="Continue";
}
function fin(){
 const n=S.items.length,xp=S.ok*10*S.m,kp=S.key&&S.m==1&&/^\d+\.\d+$/.test(S.key)?S.key.split(".").map(Number):null,nx=kp?nextTP(kp[0],kp[1]):null,pv=kp?prevTP(kp[0],kp[1]):null;
 st.xp+=xp;let rw="";const ok=S.key&&(S.m==1||S.ok/n>=.6),first=ok&&!st.done[S.key];if(ok)st.done[S.key]=1;if(first)for(let j=0;j<S.m;j++){const k=["freeze","fifty","skip"][Math.random()*3|0];iv()[k]++;rw+=PN[k]+"  "}save();
 ov.innerHTML=`<div class="body c"><h2>${S.m>1?"Unit test complete":S.key?"Lesson complete":"Quiz complete"}</h2><p>You got ${S.ok} of ${n} right and earned ${xp} XP.${S.m>1&&S.ok/n<.6?" Score at least 60% to pass the test.":""}</p>${rw?`<p>Power-ups earned: <b>${rw}</b></p>`:""}<br>${nx?`<button class="go" onclick="topic(${nx[0]},${nx[1]})">Next checkpoint →</button><br><br>`:""}${pv?`<button class="pill" onclick="topic(${pv[0]},${pv[1]})">← Previous checkpoint</button> `:""}<button class="${nx?"pill":"go"}" onclick="closeO()">${S.key?"Back to lessons":"Done"}</button></div>`;
}
function closeO(){S&&clearInterval(S.iv);ov.className="";ov.innerHTML="";render()}
render();initRes();
</script>
</body>
</html>
