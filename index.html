 {t:"Measurement and vectors",i:[
  ["Use a ruler for length and a measuring cylinder for liquid volume. To time a pendulum, time 20 swings and divide by 20.","You time 20 swings of a pendulum and get 32 s. What is the period?",["0.63 s","1.6 s","640 s","12 s"],1],
  ["A scalar has size only (distance, speed, mass, energy). A vector has size and direction (force, velocity, weight, momentum).","Which of these is a vector?",["Mass","Speed","Temperature","Force"],3],
  ["Two forces at right angles combine with Pythagoras: R = √(A² + B²).","Forces of 3 N and 4 N act at right angles. What is the resultant?",["7 N","1 N","5 N","12 N"],2,1]]},

  ["As a falling ball speeds up, air resistance grows, so the resultant force falls and the acceleration falls. At terminal velocity both are zero.","A ball falls but has not reached terminal velocity. What happens as it speeds up?",["Resultant force and acceleration both decrease","Resultant force increases","Acceleration increases","Weight decreases"],0,1],
  ["Speed is distance per unit time: v = s ÷ t. Velocity is speed in a given direction.","A car travels 150 m in 10 s. What is its speed?",["1500 m/s","15 m/s","0.07 m/s","160 m/s"],1],
  ["On a distance–time graph the gradient is the speed. A horizontal line means the object is at rest.","What does a horizontal line on a distance–time graph show?",["Constant speed","Acceleration","The object is at rest","Deceleration"],2],
  ["Acceleration is change in velocity per unit time: a = Δv ÷ Δt. A deceleration is a negative acceleration.","A car speeds up from 0 to 20 m/s in 5 s. What is its acceleration?",["4 m/s²","100 m/s²","0.25 m/s²","15 m/s²"],0,1],
  ["The area under a speed–time graph is the distance travelled.","A car moves at a constant 10 m/s for 6 s. What distance is the area under its speed–time graph?",["1.7 m","16 m","60 m","600 m"],2],
  ["At terminal velocity air resistance equals weight, so the resultant force is zero and speed stays constant.","What is true at terminal velocity?",["Weight is bigger than drag","Drag equals weight","The object accelerates","Drag is zero"],1,1]]},
 {t:"Weight, forces and momentum",i:[

  ["Resultant force = mass × acceleration (F = ma). Force and acceleration point the same way.","A resultant force of 12 N acts on a 3 kg trolley. What is its acceleration?",["36 m/s²","0.25 m/s²","15 m/s²","4 m/s²"],3,1],
  ["Momentum is mass × velocity: p = mv. It is a vector and is measured in kg m/s.","What is the momentum of a 2 kg trolley moving at 5 m/s?",["10 kg m/s","7 kg m/s","2.5 kg m/s","0.4 kg m/s"],0,1],
  ["Weight is a gravitational force: W = mg, with g ≈ 9.8 N/kg on Earth.","What is the weight of a 5 kg mass? (g = 10 N/kg)",["0.5 N","5 N","15 N","50 N"],3]]},
 {t:"Moments and stability",i:[
  ["Moment = force × perpendicular distance from the pivot. A balanced beam has equal clockwise and anticlockwise moments.","A 20 N force acts 0.5 m from a pivot. What is its moment?",["40 N m","10 N m","20.5 N m","0.025 N m"],1],
  ["An object is stable if it has a low centre of gravity and a wide base. It topples if the line of its weight falls outside the base.","What makes a bus more stable?",["A high centre of gravity","A narrow base","A low centre of gravity","Luggage on the roof"],2]]},

  ["Specific heat capacity c = ΔE ÷ (mΔθ).","2 kg of water gains 168 000 J and warms by 20 °C. What is c?",["8400 J/(kg °C)","16 800 J/(kg °C)","4200 J/(kg °C)","840 J/(kg °C)"],2,1]]},
 {t:"Thermal expansion and heat capacity",i:[
  ["Solids, liquids and gases expand when heated. Gases expand most and solids least, because particles in solids are held tightly together.","Which expands the most for the same temperature rise?",["Solid","Liquid","Gas","They all expand equally"],2],
  ["Gaps are left in railway tracks and bridges to allow for expansion on hot days.","Why are small gaps left between sections of railway track?",["To allow for expansion","To save metal","To reduce friction","To let trains turn"],0]]},
 {t:"Heat transfer",i:[
  ["Convection happens in fluids. Warmed fluid expands, becomes less dense and rises.","Why does hot air rise?",["It is less dense","It is heavier","It is lighter in mass only","It is pulled by magnets"],0],
  ["Dull black surfaces are the best absorbers and emitters of infrared radiation. Shiny white surfaces are the worst.","Which surface cools fastest by radiation?",["Shiny white","Shiny silver","Dull black","Dull white"],2],
  ["Conduction passes energy through solids. In metals, free electrons carry energy quickly.","Why are metals good thermal conductors?",["They are shiny","They contain free electrons","They have large particles","They are dense only"],1]]},
 {t:"Evaporation and boiling",i:[
  ["Evaporation happens at the surface at any temperature. The most energetic particles escape.","Why does evaporation cool a liquid?",["Cold particles arrive","Heat is added","The most energetic particles escape","The liquid expands"],2],
  ["Water melts at 0 °C and boils at 100 °C at standard atmospheric pressure. The temperature stays constant during a change of state.","What happens to the temperature of boiling water as you keep heating it?",["It keeps rising","It falls","It reaches 120 °C","It stays at 100 °C"],3]]}]},
{n:"Waves",d:"Wave properties, light, the EM spectrum and sound",k:["Use v = fλ and tell transverse from longitudinal waves","Describe reflection, refraction, diffraction and total internal reflection","Order the EM spectrum and give its uses and dangers","Describe sound, echoes, pitch and loudness","Describe how lenses form images"],f:"v = fλ, i = r, n = sin i ÷ sin r, n = 1 ÷ sin c, d = vt ÷ 2",l:[
 {t:"Wave properties",i:[
  ["The crest is the highest point of a wave and the trough the lowest. Wavelength is crest to crest. Amplitude is measured from the rest line to a crest.","A wave has a crest-to-trough height of 8 cm. What is its amplitude?",["8 cm","16 cm","4 cm","2 cm"],2],
  ["Frequency f = 1 ÷ T, where T is the period in seconds.","A wave has a period of 0.02 s. What is its frequency?",["0.02 Hz","2 Hz","50 Hz","200 Hz"],2,1],
  ["Wave speed: v = fλ. In a longitudinal wave the vibration is parallel to the direction of travel.","A wave has f = 50 Hz and λ = 2 m. What is its speed?",["25 m/s","52 m/s","100 m/s","0.04 m/s"],2],
  ["Sound waves and seismic P-waves are longitudinal. Light, water waves and S-waves are transverse.","Which of these is a longitudinal wave?",["Light","Sound","Water waves","Radio waves"],1],
  ["Frequency is waves per second (Hz). Wavelength is the distance between identical points on adjacent waves.","Radio waves travel at 3.0 × 10⁸ m/s with a wavelength of 3 m. What is the frequency?",["9.0 × 10⁸ Hz","1 Hz","1.0 × 10⁸ Hz","10 Hz"],2,1],
  ["Diffraction is the spreading of waves at a gap or edge. It is greatest when the gap is about the same size as the wavelength.","When is diffraction through a gap most noticeable?",["Gap much wider than the wavelength","Gap about the same size as the wavelength","Gap much narrower than the wavelength","It does not depend on the gap"],1]]},
 {t:"Diffraction and ripple tanks",i:[
  ["In a ripple tank, waves slow down in shallow water. Their wavelength gets shorter and they refract.","What happens to a water wave moving from deep to shallow water?",["Speed and wavelength both decrease","Frequency decreases","Speed increases","Wavelength increases"],0],
  ["The frequency of a wave does not change when it refracts. Only the speed and wavelength change.","A wave refracts. Which quantity stays the same?",["Speed","Wavelength","Frequency","Direction"],2],
  ["Diffraction is greatest when the gap is about one wavelength wide. A longer wavelength diffracts more.","Which wave diffracts most through the same gap?",["Short wavelength","Long wavelength","High frequency","Fast speed only"],1,1]]},
 {t:"Sound",i:[
  ["In a sound wave a compression is where particles are squashed together and a rarefaction is where they are spread apart.","What is a rarefaction?",["Particles squashed together","Particles spread apart","A reflection","A loud sound"],1,1],
  ["Humans hear 20 Hz to 20 000 Hz. Sound needs a medium to travel through.","Which of these cannot carry sound?",["Steel","Water","A vacuum","Air"],2],
  ["An echo is reflected sound. Distance = speed × time ÷ 2 for the round trip.","Sound (330 m/s) returns from a cliff after 2 s. How far away is the cliff?",["660 m","330 m","165 m","1320 m"],1],
  ["Higher frequency means higher pitch. Larger amplitude means a louder sound.","A louder sound of the same note has a greater…",["Frequency","Wavelength","Speed","Amplitude"],3]]},
 {t:"Light and the EM spectrum",i:[
  ["Light bends towards the normal when it slows down, for example entering glass from air.","Light enters glass from air at an angle. It bends…",["away from the normal","towards the normal","not at all","back into the air"],1],
  ["EM spectrum, low to high frequency: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.","Which has the highest frequency?",["Infrared","Radio waves","Ultraviolet","Gamma rays"],3]]},
 {t:"Reflection and total internal reflection",i:[
  ["In reflection, the angle of incidence equals the angle of reflection, both measured from the normal.","A ray hits a plane mirror with an angle of incidence of 35°. What is the angle of reflection?",["55°","70°","35°","90°"],2],
  ["Total internal reflection happens when light in a dense material meets the boundary at more than the critical angle. Optical fibres use it.","What is needed for total internal reflection?",["Angle of incidence below the critical angle","Angle of incidence above the critical angle","Light moving from air to glass","A silver coating"],1],
  ["Critical angle: n = 1 ÷ sin c.","Glass has n = 2.0. What is sin c for a glass–air boundary?",["2.0","1.0","4.0","0.5"],3,1]]},
 {t:"Refraction of light",i:[
  ["Refraction is a change in direction when light changes speed at a boundary. Entering a denser material slows light and bends it towards the normal.","A ray goes from air into glass. How do its speed and direction change?",["Faster, towards the normal","Slower, towards the normal","Slower, away from the normal","Faster, away from the normal"],1],
  ["Refractive index n = sin i ÷ sin r. A higher n means light travels more slowly in the material.","A ray has i = 45° and r = 30°. What is n?",["0.71","1.4","1.5","0.67"],1,1],
  ["The speed of light in a material = c ÷ n, where c = 3.0 × 10⁸ m/s.","Glass has n = 1.5. What is the speed of light in it?",["4.5 × 10⁸ m/s","2.0 × 10⁸ m/s","1.5 × 10⁸ m/s","3.0 × 10⁸ m/s"],1,1]]},
 {t:"Dispersion and colour",i:[
  ["White light splits into colours in a glass prism because each colour is refracted by a different amount. Violet bends most and red least.","Which colour is bent the most by a prism?",["Red","Green","Yellow","Violet"],3],
  ["The visible spectrum in order of increasing frequency: red, orange, yellow, green, blue, indigo, violet.","Which colour has the lowest frequency?",["Violet","Blue","Red","Green"],2],
  ["Visible light of a single frequency is called monochromatic.","What is monochromatic light?",["Light of many colours","Light of a single frequency","White light","Infrared radiation"],1,1]]},
 {t:"Lenses",i:[
  ["A converging lens brings parallel rays to a focus. The focal length is the distance from the lens to that focus.","What does a converging lens do to a parallel beam of light?",["Spreads it out","Brings it to a focus","Reflects it","Stops it"],1],
  ["A converging lens used as a magnifying glass, with the object closer than the focal length, makes an upright, enlarged, virtual image.","Which type of image does a magnifying glass produce?",["Real and inverted","Virtual and upright","Real and upright","Virtual and inverted"],1,1],
  ["A converging lens forms a real, inverted, diminished image when the object is beyond 2f. Between f and 2f the image is real, inverted and enlarged.","An object is far beyond 2f from a converging lens. The image is…",["Virtual, upright, enlarged","Real, inverted, diminished","Real, upright, enlarged","Virtual, inverted, diminished"],1],
  ["The focal length is the distance from the lens to the principal focus. A thicker, more curved lens has a shorter focal length.","A lens has a focal length of 10 cm. How far from the lens do parallel rays meet?",["5 cm","10 cm","20 cm","100 cm"],1],
  ["A diverging lens spreads parallel rays out and only forms virtual, upright, diminished images.","Which lens always gives a virtual, upright, diminished image?",["Converging","Diverging","Prism","Plane mirror"],1,1],
  ["Short-sightedness is corrected with a diverging lens. Long-sightedness is corrected with a converging lens.","Which lens corrects short-sightedness?",["Diverging","Converging","Plane","Cylindrical"],0,1]]},
 {t:"Uses of EM waves",i:[
  ["Microwaves are used for satellite TV, mobile phones and ovens. Infrared is used for remote controls and thermal imaging. X-rays are used for medical scans.","Which radiation is used in a TV remote control?",["Ultraviolet","Infrared","X-rays","Gamma rays"],1],
  ["Too much UV causes skin cancer and eye damage. X-rays and gamma rays damage cells. Microwaves heat body cells.","Which radiation can cause skin cancer?",["Radio waves","Infrared","Ultraviolet","Visible light"],2],
  ["All EM waves travel at 3.0 × 10⁸ m/s in a vacuum. Higher frequency means shorter wavelength.","Which EM wave has the shortest wavelength?",["Radio","Microwave","X-ray","Gamma ray"],3]]},
 {t:"Communication and signals",i:[
  ["Mobile phones use microwaves because they pass through some walls and need only a short aerial. Bluetooth uses radio waves.","Why do mobile phones use microwaves?",["They need a very long aerial","They can penetrate some walls","They travel at the speed of sound","They are visible"],1,1],
  ["Optical fibres carry light or infrared using total internal reflection. They carry data at high rates for broadband and cable TV.","How does light stay inside an optical fibre?",["Total internal reflection","Diffraction","Dispersion","Absorption"],0],
  ["Digital signals have only two values, on or off, so they can be regenerated accurately. Analogue signals vary continuously and pick up noise.","Why are digital signals better over long distances?",["They can be regenerated without noise","They need no power","They travel faster than light","They are louder"],0,1],
  ["A geostationary satellite orbits above the equator once every 24 hours, so it stays over one point on Earth. Satellite TV uses them.","What is special about a geostationary satellite?",["It orbits very low","It stays above the same point on Earth","It orbits the Moon","It never moves"],1]]},
 {t:"Ultrasound and sonar",i:[
  ["Ultrasound is sound with a frequency above 20 000 Hz, beyond human hearing.","What is ultrasound?",["Sound below 20 Hz","Sound above 20 000 Hz","Very loud sound","Radio waves"],1],
  ["Sonar sends out ultrasound and times the echo. Depth = speed × time ÷ 2.","A sonar pulse returns after 0.20 s. Sound travels at 1500 m/s in water. How deep is the sea?",["300 m","150 m","75 m","3000 m"],1,1],
  ["Ultrasound is used to scan soft tissue, such as an unborn baby, and to find cracks in materials.","Which is a use of ultrasound?",["Cooking food","Killing cancer cells","Scanning an unborn baby","Sending TV signals"],2],
  ["Sound travels fastest in solids, slower in liquids and slowest in gases, because particles are closer together in solids.","In which material does sound travel fastest?",["Air","Water","Steel","A vacuum"],2]]}]},
{n:"Electricity and magnetism",d:"Circuits, resistance, power, safety and electromagnetic effects",k:["Describe magnets, poles and field lines","Use I = Q ÷ t, V = IR, P = IV and E = IVt","Combine resistors in series and parallel","Explain mains safety, fuses and earthing","Describe electromagnetic induction, motors and transformers"],f:"I = Q ÷ t, V = IR, P = IV, E = IVt, Vp ÷ Vs = Np ÷ Ns, IpVp = IsVs",l:[
 {t:"Magnetism",i:[
  ["Like poles repel and unlike poles attract. Field lines run from the north pole to the south pole outside a magnet.","Two north poles are brought close together. What happens?",["They attract","They repel","Nothing","They swap poles"],1],
  ["Soft iron makes a temporary magnet. Steel makes a permanent magnet.","Which material is used for the core of an electromagnet?",["Steel","Copper","Soft iron","Plastic"],2]]},
 {t:"Electric charge",i:[
  ["Rubbing two insulators transfers electrons from one to the other. The one that gains electrons becomes negative and the one that loses them becomes positive.","A cloth rubs a rod and the rod becomes negatively charged. What moved?",["Protons moved to the rod","Electrons moved to the rod","Electrons moved to the cloth","Neutrons moved to the rod"],1],
  ["Like charges repel and opposite charges attract. Metals conduct because they contain free electrons.","Which pair of charges will attract each other?",["Positive and positive","Negative and negative","Positive and negative","Neutral and neutral"],2],
  ["An electric field is a region where a charge feels a force. Its direction is the direction of the force on a positive charge.","What is the direction of an electric field at a point?",["Force on a negative charge","Force on a positive charge","Towards the nearest wall","Always upwards"],1,1]]},
 {t:"Current, voltage and resistance",i:[
  ["Resistance is directly proportional to length and inversely proportional to cross-sectional area. Area is proportional to diameter squared.","A wire is replaced by one twice as long with half the diameter. By what factor does the resistance change?",["× 2","× 4","× 8","× 16"],2,1],
  ["Resistance R = V ÷ I. Electrical power P = IV.","A 12 V supply drives a current through a 4 Ω resistor. What is the current?",["48 A","3 A","8 A","0.33 A"],1],
  ["Current is the charge passing a point per unit time: I = Q ÷ t.","6 C of charge passes a point in 2 s. What is the current?",["12 A","4 A","0.33 A","3 A"],3,1]]},
 {t:"Circuits and electrical energy",i:[
  ["A series circuit has one path with the same current everywhere. In a parallel circuit the current splits between branches.","In a parallel circuit, how does the source current compare with the current in one branch?",["Smaller","The same","Larger","Zero"],2],
  ["Electrical energy E = Pt. The kilowatt-hour is power in kW × time in hours.","A 2 kW heater runs for 3 hours. How many kWh is that?",["1.5 kWh","6 kWh","0.67 kWh","5 kWh"],1],
  ["A filament lamp’s I–V graph curves because its resistance rises as the filament heats up.","Why does a filament lamp’s resistance increase with current?",["The wire gets shorter","The wire gets thicker","The filament gets hotter","The voltage falls"],2,1]]},
 {t:"Series circuits and mains safety",i:[
  ["In series, resistances add: R = R₁ + R₂. In parallel, the combined resistance is less than either resistor.","What is the total resistance of a 5 Ω and a 10 Ω resistor in series?",["15 Ω","3.3 Ω","50 Ω","5 Ω"],0],
  ["Fuses and switches go in the live wire so the appliance is made safe when switched off or when a fault occurs.","Where must a fuse be connected in a mains circuit?",["Neutral wire","Earth wire","Live wire","Any wire"],2]]},
 {t:"Electromagnetic induction",i:[
  ["Moving a wire across a magnetic field, or changing the field through a coil, induces an e.m.f. A faster change or a stronger magnet gives a bigger e.m.f.","How can you increase the induced e.m.f. in a coil?",["Move the magnet faster","Use a weaker magnet","Keep the magnet still","Remove the coil"],0],
  ["An a.c. generator spins a coil in a magnetic field. Slip rings and brushes connect the rotating coil to the circuit.","What do the slip rings do in an a.c. generator?",["Make the coil spin","Connect the rotating coil to the circuit","Strengthen the magnet","Change a.c. to d.c."],1,1]]},
 {t:"Transformers and motors",i:[
  ["For an ideal transformer IpVp = IsVs. A step-down transformer has a larger current in the secondary.","An ideal transformer has 1000 primary turns and 500 secondary turns. The secondary current is 0.4 A. What is the primary current?",["0.2 A","0.4 A","0.8 A","0.1 A"],0,1],
  ["A transformer changes voltage using coils on an iron core: Vp ÷ Vs = Np ÷ Ns. It only works with a.c.","A transformer has 100 primary turns, 500 secondary turns and a 12 V input. What is the output voltage?",["2.4 V","60 V","600 V","112 V"],1],
  ["High-voltage transmission lowers the current, so less energy is lost as heat in the cables.","Why are power lines run at very high voltage?",["Higher current gives less loss","Cables are cheaper","Lower current means less power loss","Transformers are not needed"],2],
  ["A current-carrying wire in a magnetic field experiences a force. This is how a motor turns.","What does a current-carrying wire in a magnetic field experience?",["A change in mass","A force","Cooling","Nothing"],1]]}]},
{n:"Nuclear physics",d:"The atom, radioactivity and half-life",k:["Describe the nuclear atom and use nuclide notation","Compare alpha, beta and gamma radiation","Use half-life and corrected count rate","Explain uses and safety precautions"],f:"neutrons = A − Z, fraction left = (½)ⁿ",l:[
 {t:"Atoms and nuclei",i:[
  ["Nucleon number A = protons + neutrons. Proton number Z = protons. So neutrons = A − Z.","Uranium-238 has proton number 92. How many neutrons does it have?",["92","146","238","330"],1],
  ["Protons are +1, neutrons 0 and electrons −1. A neutral atom has equal numbers of protons and electrons.","A neutral atom has 11 protons and 12 neutrons. How many electrons does it have?",["12","23","11","1"],2],
  ["Isotopes are atoms of the same element with different numbers of neutrons.","Which describes a pair of isotopes?",["Same neutrons, different protons","Same protons, different neutrons","Same nucleon number, different elements","Different protons and neutrons"],1],
  ["In alpha scattering most particles pass straight through and a few bounce back, so the atom is mostly empty space with a small, dense, positive nucleus.","What does the alpha scattering experiment show?",["Atoms are solid spheres","Electrons sit in the nucleus","Neutrons are charged","A small, dense, positive nucleus"],3,1]]},
 {t:"Types of radiation and half-life",i:[
  ["If 12.5% remains, three half-lives have passed (100, 50, 25, 12.5). Divide the time by 3.","12.5% of a sample remains after 90 years. What is the half-life?",["45 years","30 years","22.5 years","11.3 years"],1,1],
  ["Alpha is the most ionising but least penetrating. Gamma is the least ionising but most penetrating.","Which radiation is stopped by a sheet of paper?",["Gamma","Beta","Alpha","All of them"],2],
  ["After each half-life, half of the undecayed nuclei remain.","A 80 g sample has a half-life of 2 days. How much is left after 6 days?",["40 g","20 g","10 g","26.7 g"],2]]},
 {t:"Detecting and using radiation",i:[
  ["Decay is spontaneous and random. Background radiation comes from rocks, radon gas, food and cosmic rays.","A counter reads 45 counts/min with a source and 5 counts/min background. What is the corrected count rate?",["50 counts/min","40 counts/min","9 counts/min","225 counts/min"],1,1],
  ["Gamma rays are the most penetrating, so they are used to sterilise equipment. Ionising radiation can cause cell damage and cancer.","Which radiation is best for sterilising medical equipment?",["Alpha","Beta","Gamma","Ultraviolet"],2],
  ["In beta decay a neutron turns into a proton and an electron, so the proton number goes up by 1.","After beta decay, what happens to the nucleus?",["Nucleon number falls by 4","Proton number rises by 1","Proton number falls by 2","Nothing changes"],1,1]]}]},
{n:"Space physics",d:"The Earth, Solar System, stars and the Universe",k:["Explain day, night, seasons and the Moon’s phases","Describe the Solar System and gravity","Calculate light travel time and orbital speed","Describe the life cycle of stars","Explain redshift, the Big Bang and the Hubble constant"],f:"t = d ÷ c, v = 2πr ÷ T, H₀ = v ÷ d",l:[
 {t:"Earth and the Solar System",i:[
  ["Time = distance ÷ speed. Light travels at 3.0 × 10⁸ m/s.","The Sun is 1.5 × 10¹¹ m away. How long does its light take to reach Earth?",["50 s","5000 s","500 s","0.002 s"],2],
  ["The Earth orbits the Sun once in about 365 days, and its tilted axis causes the seasons.","What causes the seasons on Earth?",["Distance from the Sun only","Earth’s tilted axis as it orbits the Sun","The Moon’s orbit","Earth’s spin speed"],1],
  ["The Solar System has one star, eight planets, dwarf planets, moons, asteroids and comets. The four inner planets are small and rocky.","Which planet is closest to the Sun?",["Venus","Earth","Mercury","Mars"],2],
  ["The Earth spins once in about 24 hours. The Moon orbits Earth about once a month, giving the phases.","What causes day and night?",["Earth orbiting the Sun","The Moon’s orbit","The Sun moving around Earth","Earth spinning on its axis"],3],
  ["Average orbital speed v = 2πr ÷ T.","A planet orbits at radius 1.5 × 10¹¹ m with period 3.2 × 10⁷ s. What is its speed (2 s.f.)?",["2.9 × 10⁴ m/s","1.5 × 10⁴ m/s","5.9 × 10³ m/s","2.9 × 10⁷ m/s"],0,1]]},
 {t:"The Sun and the Universe",i:[
  ["Stable stars like the Sun are powered by nuclear fusion in their cores.","In a stable star, what is fused?",["Helium into hydrogen","Uranium into lead","Hydrogen into helium","Carbon into iron"],2,1],
  ["Light from distant galaxies is redshifted: its wavelength increases because they are moving away.","Redshift of distant galaxies is evidence that…",["the Universe is expanding","stars are cooling","the Sun is moving","galaxies are shrinking"],0],
  ["The Sun is a medium-sized star made mostly of hydrogen and helium. A light-year is the distance light travels in one year.","What is a light-year a unit of?",["Time","Speed","Distance","Brightness"],2]]},
 {t:"Life of a star and the Hubble constant",i:[
  ["A protostar becomes a stable star when gravity’s inward pull balances the outward force from the hot core. Massive stars end as supernovae.","What does a red supergiant become when it explodes?",["A white dwarf","A planetary nebula","A protostar","A supernova"],3,1],
  ["Hubble constant H₀ = v ÷ d.","A galaxy recedes at 2.2 × 10⁶ m/s and is 1.0 × 10²⁴ m away. What is H₀?",["2.2 × 10⁻¹⁸ s⁻¹","2.2 × 10³⁰ s⁻¹","4.5 × 10⁻¹⁹ s⁻¹","2.2 × 10¹⁸ s⁻¹"],0,1]]}]},
{n:"Experimental skills",d:"Practical Papers 5 and 6: planning, measuring and evaluating",k:["Identify independent, dependent and control variables","Read instruments and spot zero errors","Record results in tables with units","Plot graphs, draw best-fit lines and find gradients","Evaluate methods and suggest improvements"],f:"gradient = rise ÷ run, mean = total ÷ number of readings, results agree if within ± 10%",l:[
 {t:"Planning an investigation",i:[
  ["The independent variable is the one you change. The dependent variable is the one you measure. Control variables stay the same so the test is fair.","You change the length of a wire and measure its resistance. What is the independent variable?",["Resistance","Length","Current","Temperature"],1],
  ["Repeat readings and take the mean to improve reliability. Use at least five values across a suitable range.","Why repeat a measurement and take the mean?",["To make results more reliable","To change the variable","To remove all errors","To save time"],0]]},
 {t:"Results, graphs and errors",i:[
  ["Read scales to half a division. Check for zero error before you start, then correct for it.","A newtonmeter reads 0.2 N with nothing attached. This is a…",["Random error","Anomaly","Zero error","Control variable"],2],
  ["Draw a best-fit line through the points, ignoring anomalies. Find the gradient with a large triangle.","What is an anomaly?",["A result that fits the pattern","A result outside the general pattern","The mean of the readings","A control variable"],1]]}]}

"Reflection and total internal reflection":"Normal~line at right angles to a surface;Critical angle~the angle of incidence above which total internal reflection happens;Virtual image~an image that cannot be projected onto a screen",
"Refraction of light":"Refractive index~ratio of the speed of light in a vacuum to its speed in the material, n = sin i ÷ sin r;Angle of incidence~angle between the incoming ray and the normal;Angle of refraction~angle between the refracted ray and the normal",
"Dispersion and colour":"Dispersion~splitting of white light into its colours;Monochromatic~light of a single frequency;Spectrum~the band of colours from red to violet",
"Diffraction and ripple tanks":"Wavefront~a line joining points of a wave that are in step;Ripple tank~a shallow tray of water used to show wave behaviour;Diffraction~spreading of waves at a gap or edge",
"Uses of EM waves":"Infrared~heat radiation used in remote controls and thermal imaging;Ultraviolet~used for security marking and sterilising water;X-rays~used for medical scans but harmful to cells",
"Communication and signals":"Analogue signal~varies continuously;Digital signal~has only two states, on or off;Geostationary satellite~stays above one point on the equator with a period of 24 hours;Optical fibre~a glass strand that carries light by total internal reflection",
"Ultrasound and sonar":"Ultrasound~sound with frequency above 20 kHz;Sonar~uses ultrasound echoes to find depth or distance;Compression~a region of squashed particles in a sound wave;Rarefaction~a region of spread-out particles",
"Lenses":"Principal axis~the line through the centre of the lens at right angles to it;Optical centre~the middle of the lens where rays pass straight through;Principal focus~where parallel rays meet after a converging lens;Focal length~distance from the lens to the principal focus;Real image~an image that can be projected onto a screen",
"Magnetism":"Magnetic field~region where a magnetic pole feels a force;Induced magnetism~a magnetic material becomes magnetic near a magnet;Electromagnet~a coil with a current and a soft-iron core",
"Electric charge":"Electrostatic charge~charge built up on an insulator by friction;Conductor~lets charge flow;Insulator~does not let charge flow;Coulomb~the unit of charge",
"Current, voltage and resistance":"Current~charge passing a point per unit time;Potential difference~work done per unit charge;E.m.f.~work done by a source per unit charge around a circuit;Resistance~potential difference ÷ current",
"Circuits and electrical energy":"Series circuit~components in one loop with the same current throughout;Parallel circuit~components on separate branches;Kilowatt-hour~energy used by a 1 kW device in 1 hour",
"Series circuits and mains safety":"Live wire~carries the alternating voltage into an appliance;Earth wire~safety wire that carries current away if there is a fault;Fuse~a thin wire that melts if the current is too high",
"Electromagnetic induction":"Electromagnetic induction~an e.m.f. induced when a conductor cuts or is linked by a changing magnetic field;Alternating current~current that changes direction regularly;Slip rings~keep the rotating coil connected to the circuit",
"Transformers and motors":"Step-up transformer~more turns on the secondary, so higher voltage;Step-down transformer~fewer turns on the secondary, so lower voltage;Motor effect~a force on a current-carrying wire in a magnetic field",
"Atoms and nuclei":"Proton number~number of protons in the nucleus;Nucleon number~protons plus neutrons;Isotope~atoms of the same element with different numbers of neutrons;Ion~an atom that has gained or lost electrons",
"Types of radiation and half-life":"Alpha~a helium nucleus, strongly ionising, stopped by paper;Beta~a fast electron, stopped by thin aluminium;Gamma~electromagnetic radiation, stopped by thick lead;Half-life~time for half the nuclei in a sample to decay",
"Detecting and using radiation":"Background radiation~radiation always present from natural sources;Count rate~number of counts detected per second or minute;Ionising radiation~radiation that can damage or kill living cells",
"Earth and the Solar System":"Orbit~the curved path of an object around a star or planet;Light-year~distance light travels in one year;Dwarf planet~a small body orbiting the Sun that is not a moon, such as Pluto",
"The Sun and the Universe":"Galaxy~a group of billions of stars;Redshift~increase in observed wavelength from a receding source;Big Bang~the theory that the Universe began from a single point and has expanded since",
