"Particle model and gases":`<h3 class='sub'>2.1.1 States of matter</h3><ul class='ki'><li><b>Solid:</b> fixed shape and volume; particles in a regular arrangement, close together, vibrating about fixed positions.</li><li><b>Liquid:</b> fixed volume but takes the shape of its container; particles close but able to slide past one another.</li><li><b>Gas:</b> no fixed shape or volume; particles far apart and moving quickly and randomly.</li><li>Changes of state: melting (solid to liquid), freezing, boiling and evaporation (liquid to gas), condensation (gas to liquid). Gas to solid and solid to gas are not required.</li></ul><svg class='d' viewBox='0 0 420 110' role='img' aria-label='Particles arranged in a solid, a liquid and a gas'><rect x='10' y='5' width='120' height='90'/><rect x='150' y='5' width='120' height='90'/><rect x='290' y='5' width='120' height='90'/><path d='M28 25h.1M48 25h.1M68 25h.1M88 25h.1M108 25h.1M28 45h.1M48 45h.1M68 45h.1M88 45h.1M108 45h.1M28 65h.1M48 65h.1M68 65h.1M88 65h.1M108 65h.1M28 85h.1M48 85h.1M68 85h.1M88 85h.1M108 85h.1M170 85h.1M186 80h.1M202 86h.1M218 80h.1M234 85h.1M250 80h.1M178 68h.1M196 66h.1M214 70h.1M232 66h.1M246 62h.1M186 52h.1M206 50h.1M226 52h.1M312 20h.1M380 30h.1M340 55h.1M300 80h.1M390 75h.1M355 85h.1' stroke-linecap='round' style='stroke-width:9'/><text x='12' y='104' style='font-size:11px'>Solid</text><text x='162' y='104' style='font-size:11px'>Liquid</text><text x='302' y='104' style='font-size:11px'>Gas</text></svg><h3 class='sub'>2.1.2 Particle model</h3><ul class='ki'><li>The relationship between particle motion and temperature: hotter means faster particles.</li><li><b>Absolute zero</b> is −273 °C (0 K), the lowest possible temperature, where particles have least kinetic energy.</li><li><b>Brownian motion:</b> small visible particles move randomly because invisible molecules keep colliding with them. Evidence for the particle model.</li><li><b>Gas pressure</b> is caused by particles colliding with a surface. Each collision exerts a small force; the total force per unit area is the pressure.</li><li>Supplement: forces between particles affect the properties of solids, liquids and gases.</li></ul><h3 class='sub'>2.1.3 Gases and absolute temperature</h3><ul class='ki'><li>Convert: <b>T (K) = θ (°C) + 273</b>. Example: 27 °C = 300 K.</li><li><b>Constant volume:</b> heating raises temperature and pressure (faster and more frequent collisions).</li><li><b>Constant temperature:</b> compressing a gas raises its pressure (more frequent collisions with the walls).</li><li>Supplement: <b>pV = constant</b> for a fixed mass at constant temperature. A graph of p against 1 ÷ V is a straight line through the origin.</li></ul><svg class='d' viewBox='0 0 420 130' role='img' aria-label='Pressure against volume at constant temperature'><line x1='40' y1='110' x2='400' y2='110'/><line x1='40' y1='110' x2='40' y2='10'/><path class='r' d='M60 20 Q110 40 160 70 T380 100'/><text x='380' y='126'>V</text><text x='8' y='18'>p</text><text x='240' y='46'>pV = constant</text></svg><p>Example: 2.0 × 10⁵ Pa at 4.0 m³ becomes 1.0 × 10⁵ Pa at 8.0 m³.</p>`,
"Thermal expansion and heat capacity":`<h3 class='sub'>2.2.1 Thermal expansion</h3><ul class='ki'><li>Solids, liquids and gases expand when heated at constant pressure: particles vibrate or move more and need more space.</li><li>Gases expand most, liquids less, solids least (Supplement: explained by the spacing and motion of particles).</li><li>Uses and consequences: gaps in railway tracks and bridges, bimetallic strips in thermostats, liquid thermometers, loose jar lids that loosen when warmed.</li></ul><svg class='d' viewBox='0 0 420 120' role='img' aria-label='Bimetallic strip bending when heated'><rect x='40' y='30' width='240' height='24' style='fill:#e5484d;stroke:none'/><rect x='40' y='54' width='240' height='24' style='fill:#1f5eff;stroke:none'/><path d='M280 42 Q340 20 370 60' class='r'/><text x='40' y='24' style='font-size:12px'>metal with larger expansion (top)</text><text x='40' y='100' style='font-size:12px'>metal with smaller expansion (bottom)</text><text x='300' y='100' style='font-size:12px'>heated: strip bends</text></svg><h3 class='sub'>2.2.2 Specific heat capacity</h3><ul class='ki'><li>Raising the temperature of an object increases its <b>internal energy</b> (the total kinetic and potential energy of its particles).</li><li>Supplement: the average kinetic energy of all particles increases.</li><li>Definition: <b>c = ΔE ÷ (mΔθ)</b>, energy per unit mass per unit temperature rise, in J/(kg °C).</li><li>Experiment: heat a block with an electric heater for a measured time, record the energy from the power and time, and the temperature rise. For a liquid, use an immersion heater in an insulated beaker.</li></ul><p>Example: heating 0.5 kg of a metal with c = 400 J/(kg °C) by 10 °C needs 0.5 × 400 × 10 = <b>2000 J</b>. Water has a high c, so it takes a lot of energy to warm and cools slowly, which is why it is used in heating systems.</p>`,
"Heat transfer":`<h3 class='sub'>2.3.1 Conduction</h3><ul class='ki'><li>Conduction passes energy through solids by particle vibrations. Metals also use free (delocalised) electrons, which move energy quickly, so metals are good conductors.</li><li>Gases and most liquids are poor conductors because their particles are far apart.</li><li>Good conductors: copper, aluminium. Poor conductors (insulators): wood, plastic, glass, foam.</li></ul><svg class='d' viewBox='0 0 420 110' role='img' aria-label='Heat conducted along a metal rod with thermometers'><rect x='40' y='40' width='320' height='18' class='b'/><text x='40' y='28' style='font-size:12px'>hot</text><text x='320' y='28' style='font-size:12px'>cold</text><line class='r' x1='60' y1='60' x2='60' y2='80'/><line class='r' x1='160' y1='60' x2='160' y2='80'/><line class='r' x1='260' y1='60' x2='260' y2='80'/><line class='r' x1='340' y1='60' x2='340' y2='80'/><path d='M40 35 L60 22' class='r'/><text x='40' y='100' style='font-size:12px'>energy flows along the rod</text></svg><h3 class='sub'>2.3.2 Convection</h3><ul class='ki'><li>Convection happens in liquids and gases. A heated fluid expands, becomes less dense and rises; cooler, denser fluid sinks to replace it, setting up a convection current.</li><li>Explain with density changes and show with experiments such as coloured crystals dropped into warm water.</li></ul><svg class='d' viewBox='0 0 420 130' role='img' aria-label='Convection current in a beaker heated at the bottom'><rect x='80' y='10' width='260' height='100' class='g' style='fill:none'/><path class='r' d='M120 100 L120 30 L80 30'/><path class='r' d='M300 30 L300 100 L340 100'/><path class='r' d='M120 100 L300 100'/><text x='190' y='126' style='font-size:12px'>heat source</text><text x='100' y='20' style='font-size:12px'>cool, dense fluid sinks</text></svg><h3 class='sub'>2.3.3 Radiation</h3><ul class='ki'><li>All objects emit infrared (thermal) radiation. It needs no medium, so it is how the Sun heats the Earth.</li><li><b>Surface colour and texture:</b> dull black surfaces are the best emitters and absorbers of infrared. Shiny surfaces (especially white or silver) are the best reflectors and worst emitters and absorbers.</li><li>Experiments: a Leslie cube with its faces painted differently, placed beside a radiation detector at the same distance.</li><li>Supplement: an object at constant temperature emits energy at the same rate it receives it. If it absorbs faster, its temperature rises.</li><li>Supplement: emission rate depends on surface temperature and surface area.</li></ul><svg class='d' viewBox='0 0 420 120' role='img' aria-label='Infrared emitted by dull and shiny surfaces'><rect x='30' y='30' width='80' height='60' style='fill:#222;stroke:var(--ink)'/><rect x='170' y='30' width='80' height='60' style='fill:#eee;stroke:var(--ink)'/><text x='30' y='110' style='font-size:12px'>dull black: many waves</text><text x='170' y='110' style='font-size:12px'>shiny white: few waves</text><path class='r' d='M70 20 q10 -8 20 0 t20 0 M60 12 q10 -8 20 0 t20 0'/><path class='r' d='M210 20 q10 -8 20 0 t20 0'/><text x='290' y='60' style='font-size:12px'>vacuum flask: no conduction</text><text x='290' y='80' style='font-size:12px'>or convection, shiny walls</text></svg><h3 class='sub'>2.3.4 Consequences</h3><p>Basic applications: kitchen pans (conduction through the base), a room heated by a radiator (convection currents), the Earth’s temperature (balance between incoming and emitted radiation). More complex: a fire burning wood (all three methods) and a car radiator (conduction through the metal and convection in the coolant).</p>`,
"Evaporation and boiling":`<h3 class='sub'>2.2.3 Melting, boiling and evaporation</h3><ul class='ki'><li>Melting and boiling: energy is supplied without a change in temperature. The energy breaks attractions between particles.</li><li>Standard atmospheric pressure: water melts at 0 °C and boils at 100 °C.</li><li>Condensation and solidification release energy: particles lose kinetic energy and bond together.</li><li><b>Evaporation</b>: the most energetic particles escape from the surface at any temperature, so the liquid cools.</li><li>Supplement: boiling happens throughout the liquid at its boiling point; evaporation only at the surface.</li><li>Evaporation is faster with higher temperature, larger surface area and moving air.</li></ul><svg class='d' viewBox='0 0 420 170' role='img' aria-label='Heating curve for water showing flat sections during melting and boiling'><line x1='50' y1='140' x2='400' y2='140'/><line x1='50' y1='140' x2='50' y2='15'/><path class='r' d='M50 120 L130 120 L170 100 L210 100 L250 60 L290 60 L330 40 L330 40'/><path class='r' d='M130 120 L170 120'/><text x='10' y='20'>°C</text><text x='70' y='134' style='font-size:12px'>ice</text><text x='150' y='112' style='font-size:12px'>melting at 0 °C</text><text x='240' y='54' style='font-size:12px'>boiling at 100 °C</text><text x='360' y='158' style='font-size:12px'>time</text></svg><p>Example: a 2 kg block of ice at 0 °C needs energy to melt before its temperature starts to rise. The flat section of the graph shows energy going into breaking bonds, not raising temperature.</p><h3 class='sub'>Syllabus checklist (2.2.3)</h3><ul class='ki'><li>Describe melting and boiling in terms of energy input without a temperature change.</li><li>Describe condensation and solidification in terms of particles.</li><li>Describe evaporation in terms of escaping energetic particles, and explain its cooling effect.</li><li>Supplement: describe how temperature, surface area and air movement affect evaporation, and explain why an evaporating liquid cools an object in contact with it.</li></ul>`});

"Circuits and electrical energy":`<h3 class='sub'>Syllabus checklist (4.2.5, 4.3.1 to 4.3.3)</h3><ul class='ki'><li>Draw and interpret circuit diagrams with cells, batteries, switches, resistors, heaters, thermistors (NTC), LDRs, lamps, motors, bells, meters, coils, transformers, fuses and relays. Supplement: diodes and LEDs.</li><li>Know current is the same at every point in series; build and use series and parallel circuits.</li><li>Calculate combined e.m.f. in series and combined resistance of resistors in series (R = R₁ + R₂).</li><li>Know parallel branch current is smaller than the source current, and combined parallel resistance is less than either resistor; state why lamps are wired in parallel.</li><li>Supplement: use current into a junction = current out; use p.d. rules for series and parallel; calculate combined parallel resistance.</li><li>Know p.d. across a conductor increases as resistance increases at constant current. Supplement: describe a potential divider and use R₁ ÷ R₂ = V₁ ÷ V₂.</li><li>Understand circuits transfer energy from a source to components and the surroundings; use P = IV and E = IVt; define the kilowatt-hour and calculate cost.</li></ul><svg class='d' viewBox='0 0 420 120' role='img' aria-label='A potential divider made of two resistors'><line x1='40' y1='10' x2='40' y2='100'/><line x1='40' y1='10' x2='200' y2='10'/><line x1='200' y1='10' x2='200' y2='100'/><line x1='40' y1='100' x2='200' y2='100'/><rect x='190' y='25' width='20' height='30' class='b'/><rect x='190' y='65' width='20' height='30' class='b'/><circle cx='320' cy='55' r='26'/><text x='312' y='60'>V</text><line class='g' x1='210' y1='40' x2='320' y2='29'/><line class='g' x1='210' y1='80' x2='320' y2='81'/><text x='14' y='60'>R₁</text><text x='14' y='90'>R₂</text></svg>`,
"Electromagnetic induction":`<h3 class='sub'>Syllabus checklist (4.5.1, 4.5.2)</h3><ul class='ki'><li>Know a moving conductor or a changing field can induce an e.m.f.; describe a demonstration experiment; state the factors affecting its size (speed, field strength, number of turns).</li><li>Supplement: know the induced e.m.f. opposes the change that causes it; state and use the relative directions of force, field and induced current.</li><li>Describe a simple a.c. generator (rotating coil or magnet) with slip rings and brushes; sketch and interpret e.m.f. against time, relating peaks, troughs and zeros to coil position.</li></ul><p>In a generator the e.m.f. is zero when the coil is parallel to the field (cutting no field lines) and maximum when it is perpendicular to the field (cutting lines fastest). A d.c. generator uses a split-ring commutator instead of slip rings to keep the output in one direction.</p>`,

"Atoms and nuclei":`<p>An atom has a tiny, dense, positively charged nucleus (protons and neutrons) surrounded by orbiting electrons. Protons = +1, neutrons = 0, electrons = −1. A neutral atom has equal protons and electrons; an <b>ion</b> has gained or lost electrons.</p><svg class='d' viewBox='0 0 420 150' role='img' aria-label='Nuclide notation and a simple atom diagram'><circle cx='320' cy='75' r='60' class='g' style='fill:none'/><circle cx='320' cy='45' r='7' style='fill:var(--blue);stroke:none'/><circle cx='365' cy='90' r='7' style='fill:var(--blue);stroke:none'/><circle cx='275' cy='100' r='7' style='fill:var(--blue);stroke:none'/><circle cx='320' cy='75' r='14' class='b'/><text x='60' y='60' style='font-size:34px'>A</text><text x='60' y='100' style='font-size:34px'>Z</text><text x='95' y='85' style='font-size:34px'>X</text><text x='30' y='130' style='font-size:13px'>A = nucleon number (protons + neutrons)</text><text x='30' y='148' style='font-size:13px'>Z = proton number (protons)</text><text x='260' y='20' style='font-size:13px'>electrons orbit the nucleus</text></svg><p><b>Isotopes</b> share the same Z but different A, so different numbers of neutrons. In alpha-particle scattering, most particles pass straight through a thin metal foil, but a few bounce back through large angles. This shows the atom is mostly empty space, with a very small, dense, positively charged nucleus containing most of the mass.</p><h3 class='sub'>Syllabus checklist (5.1)</h3><ul class='ki'><li>Describe the atom: positive nucleus, orbiting negative electrons.</li><li>Know atoms form ions by losing or gaining electrons.</li><li>Describe the nucleus: protons and neutrons; state the relative charges +1, 0, −1.</li><li>Define proton number Z and nucleon number A; calculate the number of neutrons; use nuclide notation; explain isotopes.</li><li>Supplement: describe how alpha scattering supports the nuclear model (small nucleus, most mass, positive charge).</li><li>Supplement: describe nuclear fission and fusion as splitting or joining of nuclei, with a nuclide equation and a qualitative description of mass/energy change; know the links between proton number and charge, and nucleon number and mass.</li></ul>`,
"Types of radiation and half-life":`<p>Radioactive decay is spontaneous and random: you cannot predict which nucleus decays next or exactly when. Each type of emission has different properties.</p><svg class='d' viewBox='0 0 420 130' role='img' aria-label='Penetrating power of alpha beta and gamma radiation through paper aluminium and lead'><rect x='60' y='20' width='10' height='90' class='b'/><rect x='210' y='20' width='16' height='90' class='b'/><rect x='360' y='20' width='28' height='90' class='b'/><line class='r' x1='10' y1='40' x2='65' y2='40'/><text x='10' y='32' style='font-size:12px'>alpha</text><text x='10' y='56' style='font-size:12px'>stopped by paper</text><line class='r' x1='10' y1='65' x2='215' y2='65'/><text x='10' y='80' style='font-size:12px'>beta: stopped by a few mm of aluminium</text><line class='r' x1='10' y1='95' x2='365' y2='95'/><text x='10' y='112' style='font-size:12px'>gamma: needs thick lead</text><text x='58' y='128' style='font-size:11px'>paper</text><text x='205' y='128' style='font-size:11px'>aluminium</text><text x='358' y='128' style='font-size:11px'>lead</text></svg><p>Alpha is a helium nucleus (strongly ionising, least penetrating). Beta is a fast electron (moderately ionising and penetrating). Gamma is electromagnetic radiation (weakly ionising, most penetrating). A more ionising particle transfers energy faster and so is stopped sooner.</p><h3 class='sub'>Half-life</h3><svg class='d' viewBox='0 0 420 150' role='img' aria-label='Decay curve showing activity halving every half-life'><line x1='40' y1='130' x2='400' y2='130'/><line x1='40' y1='130' x2='40' y2='10'/><path class='r' d='M40 20 Q110 55 150 75 T260 102 T400 120'/><line class='g' x1='40' y1='75' x2='150' y2='75'/><line class='g' x1='150' y1='75' x2='150' y2='130'/><line class='g' x1='40' y1='102' x2='260' y2='102'/><line class='g' x1='260' y1='102' x2='260' y2='130'/><text x='8' y='18'>activity</text><text x='380' y='146'>time</text><text x='152' y='146' style='font-size:11px'>1 half-life</text><text x='262' y='146' style='font-size:11px'>2 half-lives</text></svg><p>Each half-life halves the number of undecayed nuclei (and the activity): after n half-lives, the fraction remaining is (½)ⁿ. Example: 80 g with a 2-day half-life → 40 g after 2 days, 20 g after 4 days, 10 g after 6 days (3 half-lives).</p><h3 class='sub'>Syllabus checklist (5.2.1 to 5.2.4)</h3><ul class='ki'><li>Know ionising radiation is measured with a detector and counter, in counts/s or counts/min.</li><li>Describe the emission of radiation as spontaneous and random in direction.</li><li>Identify alpha, beta and gamma by their nature, relative ionising effect and relative penetrating ability.</li><li>Know that during alpha or beta decay the nucleus changes to a different element.</li><li>Define half-life and use it in calculations with tables or decay curves.</li><li>Supplement: describe deflection of alpha, beta and gamma in electric and magnetic fields; explain ionising effects by kinetic energy and charge.</li><li>Supplement: know isotopes may be radioactive due to excess neutrons or being too heavy; describe how alpha, beta and gamma emission change the nucleus (including neutron → proton + electron in beta decay); use decay equations with nuclide notation; calculate half-life from data or decay curves.</li></ul>`,
"Detecting and using radiation":`<p><b>Background radiation</b> comes from radon gas in the air, rocks and buildings, food and drink, and cosmic rays. To find the <b>corrected count rate</b>, subtract the background reading from the measured reading.</p><p>Example: a source gives 240 counts/min and the background is 30 counts/min, so the corrected count rate is 210 counts/min.</p><ul class='ki'><li><b>Smoke alarm:</b> a weak alpha source ionises air between two plates; smoke blocks the ions and current falls, triggering the alarm. Alpha is chosen because it is easily absorbed by smoke but safe at a distance.</li><li><b>Thickness control:</b> beta or gamma radiation passes through a material to a detector; thickness changes alter the count rate, which adjusts rollers.</li><li><b>Sterilising:</b> gamma rays kill bacteria on food or medical equipment without making it radioactive.</li><li><b>Medical diagnosis and treatment:</b> gamma-emitting tracers for imaging; targeted gamma or other radiation to treat cancer.</li></ul><h3 class='sub'>Safety precautions</h3><p>Reduce exposure <b>time</b>, increase <b>distance</b> from the source, and use <b>shielding</b> (lead or thick concrete for gamma, aluminium for beta). Radioactive materials are moved in shielded containers, handled with tongs, and stored in locked, labelled containers.</p><h3 class='sub'>Syllabus checklist (5.2.1, 5.2.4, 5.2.5)</h3><ul class='ki'><li>Know background radiation sources and that ionising radiation is measured with a detector and counter.</li><li>Supplement: use measurements of background radiation to find a corrected count rate.</li><li>Supplement: explain how the type of radiation and its half-life determine its use (smoke alarms, irradiating food, sterilising equipment, thickness control, cancer diagnosis and treatment).</li><li>State effects of ionising radiation on living things: cell death, mutation, cancer.</li><li>Describe how radioactive materials are moved, used and stored safely. Supplement: explain safety precautions in terms of time, distance and shielding.</li></ul>`});

function lensLab(){

<h2>1. What is a lens?</h2><p>A lens is a piece of transparent glass or plastic with curved surfaces. Light refracts as it enters and leaves, so a beam changes direction. On a ray diagram a thin lens is drawn as a single vertical line through the <b>optical centre</b>, with arrowheads showing whether it converges or diverges light — outward arrows for convex, inward arrows for concave.</p><div class='dpanel'><svg class='d' viewBox='0 0 420 170' role='img' aria-label='A convex lens converging rays to a real focus and a concave lens diverging rays from a virtual focus'><rect width='420' height='170' rx='14' style='fill:var(--card);stroke:none'/>
<path d='M95 20 Q122 85 95 150 Q68 85 95 20Z' style='fill:#1f5eff;fill-opacity:.14;stroke:#1f5eff;stroke-width:2'/>${ARW(95,85,95,20,'#1f5eff',3)}${ARW(95,85,95,150,'#1f5eff',3)}
<line x1='15' y1='55' x2='95' y2='55' style='stroke:#64748b;stroke-width:2.5'/><line x1='15' y1='85' x2='170' y2='85' style='stroke:#64748b;stroke-width:2.5'/><line x1='15' y1='115' x2='95' y2='115' style='stroke:#64748b;stroke-width:2.5'/>${ARW(95,55,170,85,'#64748b',2.5)}${ARW(95,115,170,85,'#64748b',2.5)}
<circle cx='170' cy='85' r='3' style='fill:#17874f;stroke:none'/><text x='160' y='105' style='font-size:12px;fill:#17874f;font-weight:700'>F</text><text x='18' y='164' style='font-size:12px;fill:var(--mut)'>convex: rays converge to a real focus</text>
<path d='M300 20 Q324 85 300 150 L344 150 Q320 85 344 20Z' style='fill:#7c3aed;fill-opacity:.14;stroke:#7c3aed;stroke-width:2'/>${ARW(322,20,322,65,'#7c3aed',3)}${ARW(322,150,322,105,'#7c3aed',3)}
<line x1='225' y1='55' x2='322' y2='55' style='stroke:#64748b;stroke-width:2.5'/><line x1='225' y1='85' x2='408' y2='85' style='stroke:#64748b;stroke-width:2.5'/><line x1='225' y1='115' x2='322' y2='115' style='stroke:#64748b;stroke-width:2.5'/>${ARW(322,55,408,27,'#64748b',2.5)}${ARW(322,115,408,143,'#64748b',2.5)}
<line x1='322' y1='55' x2='262' y2='85' style='stroke:#64748b;stroke-width:2;stroke-dasharray:5 4'/><line x1='322' y1='115' x2='262' y2='85' style='stroke:#64748b;stroke-width:2;stroke-dasharray:5 4'/><circle cx='262' cy='85' r='3' style='fill:#7c3aed;stroke:none'/><text x='238' y='105' style='font-size:12px;fill:#7c3aed;font-weight:700'>virtual F</text><text x='228' y='164' style='font-size:12px;fill:var(--mut)'>concave: rays diverge from a virtual focus</text></svg></div>
<h2>2. Key terms</h2><ul class='ki'><li><b>Principal axis:</b> the line through the centre of the lens at right angles to it.</li><li><b>Optical centre:</b> the middle of the lens. Rays through it are not bent.</li><li><b>Principal focus F:</b> where rays parallel to the axis meet (convex) or appear to come from (concave). There is one on each side.</li><li><b>Focal length f:</b> the distance from the optical centre to F. 2F is twice that distance.</li></ul>
<h2>3. Convex (converging) lens</h2><p>A convex lens is thicker in the middle. It brings parallel rays together at a real focus on the far side. Three rays are easy to draw: (1) a ray parallel to the axis passes through F after the lens, (2) a ray through the optical centre goes straight on, and (3) a ray through the near F leaves parallel to the axis. Where rays cross, a <b>real image</b> forms. It can be shown on a screen.</p>
<h2>4. Concave (diverging) lens</h2><p>A concave lens is thinner in the middle. It spreads parallel rays out so they seem to come from a virtual focus on the incoming side. A ray parallel to the axis leaves as if from F, and a ray through the centre goes straight on. The rays never cross, so the image is always <b>virtual</b>, upright and diminished, between the lens and F.</p>
<h2>5. Image position and object position</h2><div class='tw'><table><thead><tr><th>Object (convex)</th><th>Image position</th><th>Type</th><th>Orientation</th><th>Size</th><th>Use</th></tr></thead><tbody><tr><td>Beyond 2F</td><td>Between F and 2F</td><td>Real</td><td>Inverted</td><td>Diminished</td><td>Camera, eye</td></tr><tr><td>At 2F</td><td>At 2F</td><td>Real</td><td>Inverted</td><td>Same size</td><td>Photocopier</td></tr><tr><td>Between F and 2F</td><td>Beyond 2F</td><td>Real</td><td>Inverted</td><td>Enlarged</td><td>Projector</td></tr><tr><td>At F</td><td>At infinity</td><td>No image</td><td>-</td><td>-</td><td>Spotlight</td></tr><tr><td>Inside F</td><td>Same side as object</td><td>Virtual</td><td>Upright</td><td>Enlarged</td><td>Magnifying glass</td></tr><tr><td>Concave, anywhere</td><td>Between lens and F</td><td>Virtual</td><td>Upright</td><td>Diminished</td><td>Correcting short sight</td></tr></tbody></table></div>
<h2>6. Interactive model</h2><p>Choose a lens and drag the slider to move the object. <span style='color:#f5a524;font-weight:700'>Orange</span> is the object, <span style='color:#17874f;font-weight:700'>green</span> a real image, <span style='color:#7c3aed;font-weight:700'>purple</span> a virtual image. Three rays are drawn: <span style='color:#1f5eff;font-weight:700'>blue</span> leaves parallel then bends through F, <span style='color:#64748b;font-weight:700'>grey</span> goes straight through the centre, and <span style='color:#0d9488;font-weight:700'>teal</span> aims at a focal point and emerges parallel. Dashed lines trace a virtual image back to where it appears to form. f = 10 cm throughout.</p><div class='lc'><select id='lt' aria-label='Lens type' onchange='LAB.t=this.value;labDraw()'><option value='convex'>Convex lens</option><option value='concave'>Concave lens</option></select><input type='range' id='lu' min='4' max='30' step='0.5' value='${LAB.u}' aria-label='Object distance' oninput='LAB.u=+this.value;labDraw()'><b id='luv'></b></div><div class='lc'>${pos}</div><div class='dpanel'><svg class='d' id='ls' viewBox='0 0 600 300' style='max-width:680px' role='img' aria-label='Interactive lens ray diagram'></svg></div><div class='box' id='lo'></div>
<h2>7. Worked examples</h2><ul class='ki'><li>f = 10 cm, object 24 cm away. This is beyond 2F (20 cm), so the image is real, inverted, diminished and between F and 2F. The lens formula 1 ÷ v = 1 ÷ f − 1 ÷ u gives v = 17 cm. (The formula is beyond the syllabus, but it checks your drawing.)</li><li>f = 10 cm, object 6 cm away. This is inside F, so the image is virtual, upright and enlarged. v = −15 cm (15 cm on the object side), magnification = 15 ÷ 6 = 2.5.</li><li>Scale diagram: draw the rays accurately, measure where a ray parallel to the axis crosses the axis to find f, and measure image distance from the lens.</li></ul><div class='box'><b>Mahidhar’s camera model.</b> Mahidhar builds a model camera with a convex lens of focal length f = 8 cm. He places a toy figure (the object) 20 cm from the lens — beyond 2F (16 cm) — and wants to know where to put the screen.</div><div class='dpanel'><svg class='d' viewBox='0 0 420 160' role='img' aria-label="Mahidhar's camera ray diagram with the object beyond 2F"><rect width='420' height='160' rx='14' style='fill:var(--card);stroke:none'/><line x1='10' y1='110' x2='410' y2='110' style='stroke:var(--mut);stroke-width:1.5'/><path d='M190 20 Q212 110 190 200 Q168 110 190 20Z' style='fill:#1f5eff;fill-opacity:.14;stroke:#1f5eff;stroke-width:2' transform='translate(0,-30)'/>${ARW(190,110,190,25,'#1f5eff',3)}${ARW(190,110,190,170,'#1f5eff',3)}<line x1='150' y1='110' x2='150' y2='120' style='stroke:var(--mut);stroke-width:2'/><text x='142' y='135' style='font-size:11px;fill:var(--mut)'>F</text><line x1='230' y1='110' x2='230' y2='120' style='stroke:var(--mut);stroke-width:2'/><text x='222' y='135' style='font-size:11px;fill:var(--mut)'>2F</text>${ARW(70,110,70,60,'#f5a524',3)}<text x='48' y='52' style='font-size:12px;font-weight:700;fill:#f5a524'>toy (object)</text><line x1='70' y1='60' x2='190' y2='60' style='stroke:#1f5eff;stroke-width:2.5'/><line x1='190' y1='60' x2='340' y2='94' style='stroke:#1f5eff;stroke-width:2.5'/><line x1='70' y1='60' x2='340' y2='94' style='stroke:#64748b;stroke-width:2.5'/>${ARW(340,110,340,94,'#17874f',3)}<text x='318' y='128' style='font-size:12px;font-weight:700;fill:#17874f'>screen (image)</text></svg></div><p>Since the object is beyond 2F, the image is real, inverted and diminished, forming between F and 2F on the far side — so Mahidhar places his screen there and sees a small, upside-down picture of the toy, just like inside a real camera.</p>
<h2>8. Lenses in everyday devices</h2><ul class='ki'><li><b>Camera:</b> object beyond 2F gives a small, real, inverted image on the sensor.</li><li><b>Projector:</b> the slide sits between F and 2F, so a large, real, inverted image forms on a distant screen. The slide is loaded upside down.</li><li><b>Magnifying glass:</b> object inside F gives a virtual, upright, enlarged image. The closer the object is to F, the larger the image.</li><li><b>Human eye:</b> a flexible convex lens focuses a real, inverted image on the retina.</li><li><b>Spectacles:</b> a converging lens for long sight and a diverging lens for short sight.</li></ul>
<h2>9. Reasoning without calculating</h2><div class='box'><b>Logic rules.</b> (1) Real images are always inverted and can be shown on a screen. Virtual images are always upright. (2) As a real object moves towards a convex lens, its real image moves away and grows. (3) A concave lens can never make a real image. (4) If the object is inside F, the image is on the same side as the object. (5) The focal length belongs to the lens and does not change when the object moves.</div><p>Covering half of a lens does not remove half of the image. Every part of the lens forms the whole image, so the image stays complete but becomes dimmer because fewer rays reach it.</p>
<h2>10. Common mistakes</h2><ul class='ki'><li>Bending the rays at the object instead of at the lens line.</li><li>Forgetting that virtual images are drawn with dashed lines.</li><li>Mixing up convex (converging) and concave (diverging).</li><li>Writing “bigger” instead of “enlarged”, or leaving out real or virtual.</li></ul>
<h2>11. Summary</h2><ul class='ki'><li>Convex lenses converge light. Concave lenses diverge light.</li><li>The image from a convex lens depends on where the object is compared with F and 2F.</li><li>Only a convex lens can make a real image. A concave lens always makes a virtual, upright, diminished image.</li></ul><h2>12. Challenge questions</h2><p>These need reasoning, not recall. Everything you need is in this chapter and the Waves syllabus.</p>${chHtml()}<button class='go' onclick='startL()'>Open the Lenses topic and practice</button></div>`;

  if(Math.abs(u-f)<.01){t='No image forms here: the rays leave the lens parallel, so the image is at infinity.';}
  else{v=u*f/(u-f);m=-v/u;ix=cx+v*k;iy=cy-m*h;vir=v<0;
   t=(u>20.01?'Real, inverted, diminished. The image is between F and 2F.':Math.abs(u-20)<.01?'Real, inverted, same size. The image is at 2F.':u>f?'Real, inverted, enlarged. The image is beyond 2F.':'Virtual, upright, enlarged. The image is on the same side as the object, further away.')+' Image distance '+Math.abs(v).toFixed(1)+' cm, magnification '+Math.abs(m).toFixed(2)+'×.';}
 }else{
  const y1=yt+(yt-cy)/(f*k)*(E-cx);g+=seg(xo,yt,cx,yt,'#1f5eff')+seg(cx,yt,E,y1,'#1f5eff');
  const y2e=cy+s2*(E-cx);g+=seg(xo,yt,E,y2e,'#64748b');
  const ffx=cx+f*k,s3=(cy-yt)/(ffx-xo);y3l=yt+s3*(cx-xo);g+=seg(xo,yt,cx,y3l,'#0d9488')+seg(cx,y3l,E,y3l,'#0d9488');
  v=u*f/(u+f);m=v/u;ix=cx-v*k;iy=cy-m*h;
  t='Virtual, upright, diminished. The image is on the same side as the object, between the lens and F. Image distance '+v.toFixed(1)+' cm, magnification '+m.toFixed(2)+'×.';
 }
 if(ix!==undefined){
  if(ix<10||ix>E)t+=' The image forms far off this diagram.';
  else{if(vir)g+=`<line class='g' x1='${cx}' y1='${yt}' x2='${ix}' y2='${iy}'/><line class='g' x1='${cx}' y1='${y3l}' x2='${ix}' y2='${iy}'/>`;
   const icol=vir?'#7c3aed':'#17874f';
   g+=ARW(ix,cy,ix,iy,icol,4,vir)+`<text x='${ix-10}' y='${iy>cy?iy+18:iy-10}' style='font-size:13px;font-weight:700;fill:${icol}'>image</text>`;}
 }
 $('#ls').innerHTML=g;
 $('#lo').innerHTML='<b>Image:</b> '+t;
}
function utest(u){run(shuf(U[u].l.flatMap(its)).slice(0,12),0,"Unit test: "+U[u].n,"t"+u,2)}
function quiz(){
 const n=u=>u.l.reduce((a,l)=>a+l.i.length,0),b=(i,t)=>`<button class="go" style="width:auto;padding:10px 22px" onclick="qz(${i})">${t}</button>`;
 return `<h1>Quiz</h1><p class="mut">Read what each quiz covers, then start. Each quiz asks up to 10 random questions from its bank, with no hints. Every question has a 25 second timer, and you can spend the power-ups you earn from lessons.</p>`+
 U.map((u,i)=>`<section class="unit"><h2>${i+1}. ${u.n}</h2><p class="mut">${u.d}</p><p><b>Lessons covered:</b> ${u.l.map(l=>l.t).join(", ")}.</p><p><b>You should be able to:</b></p><ul>${u.k.map(x=>`<li>${x}</li>`).join("")}</ul><p><b>Equations to know:</b> ${u.f}</p><p class="mut">${n(u)} questions in the bank. You get 10 random ones, with no hints. Questions tagged Extended are Supplement content.</p>${b(i,"Start unit quiz")}</section>`).join("")+
 `<section class="unit"><h2>Mixed quiz</h2><p class="mut">All units together.</p><p><b>Units covered:</b> ${U.map(u=>u.n).join("; ")}.</p><p><b>You should be able to:</b> use every equation on the formula sheet, read graphs and explain physical ideas in words.</p><p class="mut">${U.reduce((a,u)=>a+n(u),0)} questions in the bank. You get 10 random ones from all units, with no hints.</p>${b(-1,"Start mixed quiz")}</section>`;
}
function formulas(){
 return `<h1>Formula sheet</h1><p class="mut">Equations tagged Extended are Supplement content.</p><input type="search" id="q" placeholder="Search equations" aria-label="Search equations" oninput="rows(this.value)"><div class="tw"><table><thead><tr><th>Quantity</th><th>Equation</th><th>Unit</th></tr></thead><tbody id="tb"></tbody></table></div>${extra()}`;
}
function extra(){
 const t=(h,a,r)=>`<h2 style="margin-top:28px">${h}</h2><div class="tw" style="margin-top:10px"><table><thead><tr>${a.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(x=>`<tr>${x.split("|").map((c,i)=>`<td${i==1?' class="eq"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
 return t("SI units",["Quantity","Unit","Built from"],["Length|m|metre","Mass|kg|kilogram","Time|s|second","Temperature|K|kelvin (°C is also used)","Current|A|ampere","Force, weight|N|kg m/s²","Pressure|Pa|N/m²","Energy, work|J|N m","Power|W|J/s","Frequency|Hz|1/s","Charge|C|A s","Potential difference, e.m.f.|V|J/C","Resistance|Ω|V/A","Momentum|kg m/s|mass × velocity","Impulse|N s|same as kg m/s","Density|kg/m³|mass ÷ volume","Moment|N m|force × distance","Gravitational field strength|N/kg|same as m/s²","Spring constant|N/m|force ÷ extension","Specific heat capacity|J/(kg °C)|energy ÷ (mass × temperature change)","Hubble constant|s⁻¹|speed ÷ distance"])+
 t("Prefixes",["Prefix","Multiplier","Example"],["giga (G), Extended|× 10⁹|1 GW = 10⁹ W","mega (M)|× 10⁶|1 MJ = 10⁶ J","kilo (k)|× 10³|1 km = 1000 m","centi (c)|× 10⁻²|1 cm = 0.01 m","milli (m)|× 10⁻³|1 mA = 0.001 A","micro (µ), Extended|× 10⁻⁶|1 µs = 10⁻⁶ s","nano (n), Extended|× 10⁻⁹|1 nm = 10⁻⁹ m"])+
 t("Unit conversions",["Convert","Rule","Example"],["km to m|× 1000|2.5 km = 2500 m","cm to m|÷ 100|45 cm = 0.45 m","mm to m|÷ 1000|8 mm = 0.008 m","g to kg|÷ 1000|250 g = 0.25 kg","cm² to m²|÷ 10 000|200 cm² = 0.02 m²","cm³ to m³|÷ 1 000 000|50 cm³ = 5 × 10⁻⁵ m³","dm³ to cm³|× 1000|1 dm³ = 1000 cm³","g/cm³ to kg/m³|× 1000|2.7 g/cm³ = 2700 kg/m³","km/h to m/s|÷ 3.6|72 km/h = 20 m/s","m/s to km/h|× 3.6|10 m/s = 36 km/h","min to s|× 60|3 min = 180 s","h to s|× 3600|2 h = 7200 s","mA to A|÷ 1000|250 mA = 0.25 A","kW to W|× 1000|1.5 kW = 1500 W","kPa to Pa|× 1000|101 kPa = 101 000 Pa","N/cm to N/m|× 100|0.25 N/cm = 25 N/m","kWh to J|× 3.6 × 10⁶|1 kWh = 3 600 000 J","°C to K|+ 273|27 °C = 300 K","light-year to m|× 9.5 × 10¹⁵|1 ly = 9.5 × 10¹⁵ m"]);
}
function rows(q){
 q=q.toLowerCase();
 $("#tb").innerHTML=F.filter(r=>(ext||r[3]==0)&&r.slice(0,3).join(" ").toLowerCase().includes(q)).map(r=>`<tr><td>${r[0]}${r[3]==1?'<span class="tag">Extended</span>':""}</td><td class="eq">${r[1]}</td><td>${r[2]}</td></tr>`).join("")||'<tr><td colspan="3">No equations match. Try a different word.</td></tr>';
}
let TP;
const INS="You are Zyvar’s friendly Cambridge IGCSE Physics 0625 tutor for students aged 14 to 16. Stay on the topic and the syllabus. Use short paragraphs, plain language and SI units, and show calculations step by step. Do not use markdown headings or tables. If the question is off topic, gently steer back.";
const fail=x=>x&&x.code=="rate_limited"?"The tutor is busy. Please wait a moment and try again.":"The AI tutor isn’t available here. You can still use the key ideas above, or ask your teacher.";
async function ai(p,cb){const s=window.claude&&await claude.use("sample");if(!s)throw{code:"none"};return s(p,{cache:false,onText:cb})}
function cpNav(u,l){const p=prevTP(u,l),n=nextTP(u,l);return `<div class="cpnav"><button class="pill" ${p?'':'disabled'} onclick="topic(${p?p[0]:0},${p?p[1]:0})">← Back</button><span class="mut">${l+1} of ${U[u].l.length} in ${U[u].n}</span><button class="pill" ${n?'':'disabled'} onclick="topic(${n?n[0]:0},${n?n[1]:0})">Next →</button></div>`}
function topic(u,l){
 const L=U[u].l[l];TP={u,l,h:[]};ov.className="on";
 ov.innerHTML=`<div class="top"><button class="x" onclick="closeO()" aria-label="Close">×</button><p class="ttl" style="margin:0">${U[u].n}</p></div>${cpNav(u,l)}<div class="body"><h1>${L.t}</h1><h2>Key definitions</h2><dl>${defs(L.t)}</dl>${N[L.t]?`<h2>Study notes</h2><div class="notes">${N[L.t]}</div>`:""}<h2>Key ideas</h2><ul class="ki">${L.i.map(x=>`<li>${x[0]}</li>`).join("")}</ul><button class="go" onclick="lesson(${u},${l})">Start practice (${L.i.length} questions)</button>${prevTP(u,l)?` <button class="pill" onclick="topic(${prevTP(u,l)[0]},${prevTP(u,l)[1]})">← Previous checkpoint</button>`:""}${nextTP(u,l)?` <button class="pill" onclick="topic(${nextTP(u,l)[0]},${nextTP(u,l)[1]})">Next checkpoint →</button>`:""}${L.t=="Lenses"?` <button class="pill" onclick="closeO();project('lens')">Open the Lens Lab project</button>`:""}<h2 style="margin-top:28px">Detailed explanation</h2><div id="ex" class="teach">Want a fuller walkthrough with a worked example? <button class="pill" onclick="explain()">Explain in detail</button></div><h2 style="margin-top:28px">Ask the tutor</h2><div id="ch"></div><div class="cin"><input id="ci" placeholder="Ask a question about this topic" aria-label="Your question" onkeydown="if(event.key==='Enter')ask()"><button class="go" style="width:auto;padding:10px 18px" onclick="ask()">Send</button></div></div>`;
}
const ctx=()=>{const L=U[TP.u].l[TP.l];return INS+"\n\nTopic: "+L.t+" (unit: "+U[TP.u].n+")\nKey ideas the student has seen:\n"+L.i.map(x=>x[0]).join("\n")};
async function explain(){
 const e=$("#ex");e.textContent="Writing your explanation…";
 try{await ai(ctx()+"\n\nWrite a detailed explanation of this topic in about 250 words: what it means, why it matters, the key equations with units, one fully worked example and one common exam mistake. Say clearly which parts are Extended (Supplement) only.",r=>{e.textContent=r.text})}catch(x){e.textContent=fail(x)}
}
async function ask(){
 const i=$("#ci"),q=i.value.trim();if(!q)return;i.value="";
 const c=$("#ch"),add=(w,t)=>{const d=document.createElement("div");d.className="m "+w;d.textContent=t;c.append(d);d.scrollIntoView({block:"nearest"});return d};
 add("s",q);const a=add("a","Thinking…");TP.h.push("Student: "+q);
 try{const r=await ai(ctx()+"\n\nConversation so far:\n"+TP.h.slice(-8).join("\n")+"\nTutor:",t=>{a.textContent=t.text});TP.h.push("Tutor: "+r.text)}catch(x){a.textContent=fail(x)}
}
function lesson(u,l){run(its(U[u].l[l]),1,U[u].l[l].t,u+"."+l)}
function qz(u){
 const all=(u<0?U:[U[u]]).flatMap(x=>x.l.flatMap(its));
 run(shuf(all).slice(0,10),0,u<0?"Mixed quiz":"Quiz: "+U[u].n,null);
}
function run(items,teach,title,key,m){S={m:m||1,items,teach,title,key,i:0,ok:0,sel:null,chk:0};ov.className="on"+(m>1?" t":"");step()}
function step(){
 const it=S.items[S.i];S.sel=null;S.chk=0;clearInterval(S.iv);S.frz=0;
 if(!it)return fin();
 ov.innerHTML=`<div class="top"><button class="x" onclick="closeO()" aria-label="Close">×</button><div class="bar"><i style="width:${S.i/S.items.length*100}%"></i></div></div>
 <div class="body"><p class="ttl">${S.title}${it[4]?'<span class="tag">Extended</span>':""}</p>${S.teach?`<div class="teach">${it[0]}</div>`:""}<h3>${it[1]}</h3><div class="opts">${it[2].map((o,j)=>`<button class="opt" onclick="pick(${j})">${o}</button>`).join("")}</div></div>
 <div class="foot" id="ft"><div>${pw()}<p class="fb" id="fb" hidden></p><button class="go" id="go" disabled onclick="check()">Check</button></div></div>`;
}
function pick(j){
 if(S.chk)return;S.sel=j;
 document.querySelectorAll(".opt").forEach((b,k)=>b.className="opt"+(k==j?" sel":""));
 $("#go").disabled=false;
}
function check(){
 if(S.chk){S.i++;return step()}
 S.chk=1;const it=S.items[S.i],good=S.sel==it[3];
 if(good)S.ok++;
 document.querySelectorAll(".opt").forEach((b,k)=>{b.className="opt"+(k==it[3]?" ok":k==S.sel?" no":"")});
 $("#ft").className="foot "+(good?"ok":"bad");
 const f=$("#fb");f.hidden=false;f.textContent=good?"Correct":"Not quite. The answer is “"+it[2][it[3]]+"”.";
 $("#go").textContent="Continue";
}
function fin(){
 const n=S.items.length,xp=S.ok*10*S.m,kp=S.key&&S.m==1&&/^\d+\.\d+$/.test(S.key)?S.key.split(".").map(Number):null,nx=kp?nextTP(kp[0],kp[1]):null,pv=kp?prevTP(kp[0],kp[1]):null;
 st.xp+=xp;let rw="";const ok=S.key&&(S.m==1||S.ok/n>=.6),first=ok&&!st.done[S.key];if(ok)st.done[S.key]=1;if(first)for(let j=0;j<S.m;j++){const k=["freeze","fifty","skip"][Math.random()*3|0];iv()[k]++;rw+=PN[k]+"  "}save();
 ov.innerHTML=`<div class="body c"><h2>${S.m>1?"Unit test complete":S.key?"Lesson complete":"Quiz complete"}</h2><p>You got ${S.ok} of ${n} right and earned ${xp} XP.${S.m>1&&S.ok/n<.6?" Score at least 60% to pass the test.":""}</p>${rw?`<p>Power-ups earned: <b>${rw}</b></p>`:""}<br>${nx?`<button class="go" onclick="topic(${nx[0]},${nx[1]})">Next checkpoint →</button><br><br>`:""}${pv?`<button class="pill" onclick="topic(${pv[0]},${pv[1]})">← Previous checkpoint</button> `:""}<button class="${nx?"pill":"go"}" onclick="closeO()">${S.key?"Back to lessons":"Done"}</button></div>`;
}
function closeO(){S&&clearInterval(S.iv);ov.className="";ov.innerHTML="";render()}
render();initRes();
</script>
